<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img">
  <title>母線の種類と、母線・ブランチ・機器の関係</title>
  <style>
    .h { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1B2127; }
    .t { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1B2127; }
    .s { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1B2127; }
    .n { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #5A6570; }
    .c { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #1B2127; }
    .cm { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #5A6570; }
    .ln { fill: none; stroke: #5A6570; stroke-width: 1.6; stroke-linejoin: round; }
    .ob { fill: none; stroke: #5A6570; stroke-width: 1.4; stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5A6570"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="469" rx="6" fill="#FFFFFF" stroke="#DADFE4"/>
  <rect x="20.0" y="20" width="190" height="138" rx="6" fill="#FFFFFF" stroke="#DADFE4" stroke-width="1.5"/>
  <rect x="53" y="32" width="124" height="26" rx="13" fill="#7A3E12"/>
  <text class="t" x="115" y="50" text-anchor="middle" style="fill:#FFFFFF">Slack 母線</text>
  <text class="n" x="34.0" y="82">決める量:</text>
  <text class="t" x="102.0" y="82">|V| と ∠V</text>
  <text class="n" x="34.0" y="104">求める量:</text>
  <text class="s" x="102.0" y="104">P と Q</text>
  <line x1="32.0" y1="118" x2="198.0" y2="118" stroke="#DADFE4"/>
  <text class="cm" x="34.0" y="140">bus.l_isSlack = true</text>
  <path class="ln" d="M115 158 V174" marker-end="url(#a)" style="stroke:#DADFE4"/>
  <rect x="45" y="180" width="140" height="70" rx="6" fill="#E4EFE6" stroke="#2E6B3F" stroke-width="1.5"/>
  <text class="t" x="115" y="206" text-anchor="middle">発電機</text>
  <text class="cm" x="115" y="224" text-anchor="middle">Component</text>
  <text class="cm" x="115" y="241" text-anchor="middle">"gen-1axis"</text>
  <rect x="35" y="256" width="160" height="58" rx="6" fill="#FBE8D8" stroke="#C2682A" stroke-width="1.5"/>
  <text class="t" x="115" y="281" text-anchor="middle">母線  B001</text>
  <text class="cm" x="115" y="301" text-anchor="middle">Bus</text>
  <rect x="230.0" y="20" width="190" height="138" rx="6" fill="#FFFFFF" stroke="#DADFE4" stroke-width="1.5"/>
  <rect x="263" y="32" width="124" height="26" rx="13" fill="#C2682A"/>
  <text class="t" x="325" y="50" text-anchor="middle" style="fill:#FFFFFF">PV 母線</text>
  <text class="n" x="244.0" y="82">決める量:</text>
  <text class="t" x="312.0" y="82">P と |V|</text>
  <text class="n" x="244.0" y="104">求める量:</text>
  <text class="s" x="312.0" y="104">Q と ∠V</text>
  <line x1="242.0" y1="118" x2="408.0" y2="118" stroke="#DADFE4"/>
  <text class="n" x="244.0" y="140">発電機（Q を決めない）</text>
  <path class="ln" d="M325 158 V174" marker-end="url(#a)" style="stroke:#DADFE4"/>
  <rect x="255" y="180" width="140" height="70" rx="6" fill="#E4EFE6" stroke="#2E6B3F" stroke-width="1.5"/>
  <text class="t" x="325" y="206" text-anchor="middle">発電機</text>
  <text class="cm" x="325" y="224" text-anchor="middle">Component</text>
  <text class="cm" x="325" y="241" text-anchor="middle">"gen-1axis"</text>
  <rect x="245" y="256" width="160" height="58" rx="6" fill="#FBE8D8" stroke="#C2682A" stroke-width="1.5"/>
  <text class="t" x="325" y="281" text-anchor="middle">母線  B002</text>
  <text class="cm" x="325" y="301" text-anchor="middle">Bus</text>
  <rect x="440.0" y="20" width="190" height="138" rx="6" fill="#FFFFFF" stroke="#DADFE4" stroke-width="1.5"/>
  <rect x="473" y="32" width="124" height="26" rx="13" fill="#C2682A"/>
  <text class="t" x="535" y="50" text-anchor="middle" style="fill:#FFFFFF">PQ 母線</text>
  <text class="n" x="454.0" y="82">決める量:</text>
  <text class="t" x="522.0" y="82">P と Q</text>
  <text class="n" x="454.0" y="104">求める量:</text>
  <text class="s" x="522.0" y="104">|V| と ∠V</text>
  <line x1="452.0" y1="118" x2="618.0" y2="118" stroke="#DADFE4"/>
  <text class="n" x="454.0" y="140">負荷（P と Q を決める）</text>
  <path class="ln" d="M535 158 V174" marker-end="url(#a)" style="stroke:#DADFE4"/>
  <rect x="465" y="180" width="140" height="70" rx="6" fill="#E4EFE6" stroke="#2E6B3F" stroke-width="1.5"/>
  <text class="t" x="535" y="206" text-anchor="middle">負荷</text>
  <text class="cm" x="535" y="224" text-anchor="middle">Component</text>
  <text class="cm" x="535" y="241" text-anchor="middle">"load-power"</text>
  <rect x="455" y="256" width="160" height="58" rx="6" fill="#FBE8D8" stroke="#C2682A" stroke-width="1.5"/>
  <text class="t" x="535" y="281" text-anchor="middle">母線  B003</text>
  <text class="cm" x="535" y="301" text-anchor="middle">Bus</text>
  <rect x="650.0" y="20" width="190" height="138" rx="6" fill="#FFFFFF" stroke="#DADFE4" stroke-width="1.5"/>
  <rect x="683" y="32" width="124" height="26" rx="13" fill="#8A949E"/>
  <text class="t" x="745" y="50" text-anchor="middle" style="fill:#FFFFFF">PQ 母線</text>
  <text class="n" x="664.0" y="82">決める量:</text>
  <text class="t" x="732.0" y="82">P = Q = 0</text>
  <text class="n" x="664.0" y="104">求める量:</text>
  <text class="s" x="732.0" y="104">|V| と ∠V</text>
  <line x1="662.0" y1="118" x2="828.0" y2="118" stroke="#DADFE4"/>
  <text class="n" x="664.0" y="140">機器がない</text>
  <path class="ln" d="M745 158 V174" marker-end="url(#a)" style="stroke:#DADFE4"/>
  <rect x="675" y="180" width="140" height="70" rx="6" fill="none" stroke="#8A949E" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="n" x="745" y="220" text-anchor="middle">機器なし</text>
  <rect x="665" y="256" width="160" height="58" rx="6" fill="#FBE8D8" stroke="#C2682A" stroke-width="1.5"/>
  <text class="t" x="745" y="281" text-anchor="middle">母線  B004</text>
  <text class="cm" x="745" y="301" text-anchor="middle">Bus</text>
  <rect x="187" y="270" width="66" height="30" rx="5" fill="#F8F0D2" stroke="#B08A18" stroke-width="1.5"/>
  <text class="cm" x="220.0" y="290" text-anchor="middle">Branch</text>
  <rect x="397" y="270" width="66" height="30" rx="5" fill="#F8F0D2" stroke="#B08A18" stroke-width="1.5"/>
  <text class="cm" x="430.0" y="290" text-anchor="middle">Branch</text>
  <rect x="607" y="270" width="66" height="30" rx="5" fill="#F8F0D2" stroke="#B08A18" stroke-width="1.5"/>
  <text class="cm" x="640.0" y="290" text-anchor="middle">Branch</text>
  <text class="cm" x="220.0" y="262" text-anchor="middle">"pi"</text>
  <rect x="20" y="320" width="820" height="50" rx="6" fill="#ECEEF0" stroke="#5A6570" stroke-width="1.5"/>
  <text class="t" x="40" y="350">系統  PowerNetwork</text>
  <text class="c" x="820" y="350" text-anchor="end">net = PowerNetwork("FourBus");</text>
  <text class="s" x="24" y="400">・母線は系統に、機器は母線に、ブランチは 2 つの母線の間に付けます。積み木のように、下の部品がないと上の部品は付けられません。</text>
  <text class="s" x="24" y="424">・母線の種類は、付けた機器の潮流計算の条件から決まります。Slack 母線は系統に 1 つだけで、機器のある母線から選びます。</text>
  <text class="s" x="24" y="448">・|V| は電圧の大きさ、∠V は電圧の位相、P と Q は母線から系統へ注入する有効電力と無効電力です。</text>
</svg>
