<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-title-ja="GUILDA リファレンス - クラス">GUILDA Reference - Class</title>
  <script src="doc-lang.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reference.css">

  <script src="./database/list_Classes.js"></script>
  <script src="./doc-loader.js"></script>
  <script src="./doc-render.js"></script>
  <script src="./doc-tree.js"></script>
</head>
<body class="doc-layout">

  <nav id="sidebar" style="padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <a href="index.html" onclick="window.GuildaDocLoader.navigate('index.html'); return false;" style="display: block; margin-bottom: 20px;">
      <img src="./images/GUILDAicon.png" alt="GUILDA Logo" style="width: 100%;">
    </a>
    <a href="index.html#tab-reference" onclick="window.GuildaDocLoader.navigate('index.html', 'tab-reference'); return false;" class="btn" style="width: 100%; text-align: center; margin-bottom: 20px; box-sizing: border-box;"><span lang="en">← Back to Reference</span><span lang="ja">← リファレンスに戻る</span></a>

    <div id="source-tree"></div>

    <h3 style="margin-top: 0;"><span lang="en">On this page</span><span lang="ja">このページの内容</span></h3>
    <ul id="page-toc" style="list-style: none; padding-left: 0; font-size: 0.9rem; line-height: 1.8;"></ul>
  </nav>

  <main id="main-content" style="flex: 1; min-width: 0;">
    <div id="dynamic-content">
      <h1 style="color: var(--muted);"><span lang="en">Loading...</span><span lang="ja">読み込み中...</span></h1>
    </div>
  </main>

  <script>
    const loader = window.GuildaDocLoader;
    const {
      tr, setPageTitle, escapeHtml, nl2br, firstText, toList, renderMarkdown,
      classLink: renderClassLink, seeAlsoLink, sourceLocation, examplesText, groupRows
    } = window.GuildaDocRender;
    const routeParams = loader.getRouteParams();
    const className = routeParams.get('class');

    // View state of the member tables. The tables are re-rendered on their
    // own so that the search boxes keep focus while typing.
    const memberState = {
      property: { view: 'description', search: '', inherited: true, publicOnly: false, grouped: true, sort: 'name', order: 1 },
      method:   { view: 'description', search: '', inherited: true, publicOnly: false, grouped: true, sort: 'name', order: 1 }
    };
    let pageData = null;

    const methodUrl = (method) => loader.pageUrl('method.html', { class: className, method });
    const isPublic = (access) => !access || access === 'public';
    const muted = (text) => `<span class="ref-muted">${text}</span>`;

    const normalizeProperty = (p) => ({
      name: p?.Name || '',
      defining: p?.Defining || '',
      inherited: (p?.Defining || className) !== className,
      getAccess: p?.GetAccess || '',
      setAccess: p?.SetAccess || '',
      dependent: Boolean(p?.Dependent),
      constant: Boolean(p?.Constant),
      abstract: Boolean(p?.Abstract),
      hidden: Boolean(p?.Hidden),
      group: p?.Group || '',
      summary: firstText(p?.Summary, p?.Desc),
      description: [p?.Summary, p?.Desc].map((v) => (v ?? '').toString().trim()).filter(Boolean).join('\n\n'),
      // The Type tag wins; otherwise show what the declaration itself says.
      type: firstText(p?.Type, p?.Validation?.Class),
      size: firstText(p?.Validation?.Size, p?.Size),
      unit: p?.Unit || '',
      defaultValue: firstText(p?.DefaultCode, p?.Default),
      constraints: firstText(toList(p?.Validation?.Validators).join(', '), p?.Constraints),
      seeAlso: toList(p?.SeeAlso),
      deprecated: p?.Deprecated || ''
    });
    const normalizeMethod = (m) => ({
      name: m?.Name || '',
      defining: m?.Defining || '',
      inherited: (m?.Defining || className) !== className,
      access: m?.Access || '',
      static: Boolean(m?.Static),
      abstract: Boolean(m?.Abstract),
      sealed: Boolean(m?.Sealed),
      hidden: Boolean(m?.Hidden),
      constructor: Boolean(m?.IsConstructor),
      group: m?.Group || (m?.IsConstructor ? 'Constructor' : ''),
      overrides: m?.Overrides || '',
      implementedIn: m?.ImplementedIn || '',
      summary: firstText(m?.Summary, m?.Desc),
      signature: firstText(m?.Signature, toList(m?.Signatures)[0], `${m?.Name || ''}()`),
      deprecated: m?.Deprecated || ''
    });

    const flag = (value, label) => (value ? `<span class="ref-badge is-small">${label}</span>` : '');
    const definedIn = (row) => `<span class="ref-defined-in">${row.inherited ? renderClassLink(row.defining) : muted(tr('this class', 'このクラス'))}</span>`;
    const IMPLEMENTED_IN_TITLES = {
      file: ['Defined in its own file in the class folder', 'クラスフォルダ内の個別ファイルで定義'],
      private: ['Defined in the private folder of the class', 'クラスの private フォルダで定義']
    };
    // Group names written by the generator; other group names come from the source comments.
    const groupLabel = (name) => ({ Constructor: tr('Constructor', 'コンストラクタ'), Other: tr('Other', 'その他') })[name] || name;
    const memberHints = (row) => {
      const hints = [
        row.deprecated ? `<span class="ref-badge is-small is-deprecated">${tr('Deprecated', '非推奨')}</span>` : '',
        row.overrides ? `<span class="ref-badge is-small" title="${tr('Overrides', 'オーバーライド元:')} ${escapeHtml(row.overrides)}.${escapeHtml(row.name)}">${tr('overrides', 'オーバーライド元')} <a href="${loader.pageUrl('method.html', { class: row.overrides, method: row.name })}">${escapeHtml(row.overrides)}</a></span>` : '',
        IMPLEMENTED_IN_TITLES[row.implementedIn] ? `<span class="ref-badge is-small" title="${tr(...IMPLEMENTED_IN_TITLES[row.implementedIn])}">${escapeHtml(row.implementedIn)}</span>` : ''
      ].join('');
      return hints ? `<span class="ref-hints">${hints}</span>` : '';
    };
    const propertyName = (p) => `<strong>${escapeHtml(p.name)}</strong>${memberHints(p)}`;
    const methodName = (m) => `<a class="row-link" href="${methodUrl(m.name)}">${escapeHtml(m.name)}</a>${memberHints(m)}`;

    const memberViews = {
      property: {
        attributes: {
          columns: () => [['name', tr('Name', '名前')], ['getAccess', 'GetAccess'], ['setAccess', 'SetAccess'], ['flags', tr('Attributes', '属性')], ['defining', tr('Defined in', '定義元')]],
          cells: (p) => [
            propertyName(p),
            escapeHtml(p.getAccess || 'N/A'),
            escapeHtml(p.setAccess || 'N/A'),
            [flag(p.dependent, 'Dependent'), flag(p.constant, 'Constant'), flag(p.abstract, 'Abstract'), flag(p.hidden, 'Hidden')].join(' '),
            definedIn(p)
          ]
        },
        type: {
          columns: () => [['name', tr('Name', '名前')], ['type', tr('Type', '型')], ['size', tr('Size', 'サイズ')], ['unit', tr('Unit', '単位')], ['defaultValue', tr('Default', '既定値')], ['constraints', tr('Validators', '検証関数')]],
          cells: (p) => [
            propertyName(p),
            nl2br(p.type) || muted('-'),
            nl2br(p.size) || muted('-'),
            p.unit ? `<span class="ref-unit">${escapeHtml(p.unit)}</span>` : muted('-'),
            p.defaultValue ? `<span class="ref-code">${nl2br(p.defaultValue)}</span>` : muted('-'),
            nl2br(p.constraints) || muted('-')
          ]
        },
        description: {
          columns: () => [['name', tr('Name', '名前')], ['unit', tr('Unit', '単位')], ['description', tr('Description', '説明')]],
          cells: (p) => [
            propertyName(p),
            p.unit ? `<span class="ref-unit">${escapeHtml(p.unit)}</span>` : muted('-'),
            (p.description ? `<div class="markdown-content">${renderMarkdown(p.description)}</div>` : muted(tr('No description.', '説明なし。')))
              + (p.seeAlso.length ? `<p class="ref-see-also ref-muted" style="margin: 4px 0 0;">${tr('See also', '関連項目:')} ${p.seeAlso.map((item) => seeAlsoLink(item, className, pageData.methods.map((m) => m.name))).join(', ')}</p>` : '')
          ]
        }
      },
      method: {
        attributes: {
          columns: () => [['name', tr('Method', 'メソッド')], ['access', tr('Access', 'アクセス')], ['flags', tr('Attributes', '属性')], ['defining', tr('Defined in', '定義元')]],
          cells: (m) => [
            methodName(m),
            escapeHtml(m.access || 'N/A'),
            [flag(m.constructor, 'Constructor'), flag(m.static, 'Static'), flag(m.abstract, 'Abstract'), flag(m.sealed, 'Sealed'), flag(m.hidden, 'Hidden')].join(' '),
            definedIn(m)
          ]
        },
        signature: {
          columns: () => [['name', tr('Method', 'メソッド')], ['signature', tr('Signature', 'シグネチャ')]],
          cells: (m) => [
            methodName(m),
            `<span class="ref-code">${escapeHtml(m.signature)}</span>`
          ]
        },
        description: {
          columns: () => [['name', tr('Method', 'メソッド')], ['summary', tr('Summary', '概要')]],
          cells: (m) => [
            methodName(m),
            m.summary ? nl2br(m.summary) : muted(tr('No summary.', '概要なし。'))
          ]
        }
      }
    };

    const hasGroups = (kind) => (kind === 'property' ? pageData.properties : pageData.methods).some((row) => row.group);

    function renderMemberTable(kind) {
      const state = memberState[kind];
      const allRows = kind === 'property' ? pageData.properties : pageData.methods;
      const view = memberViews[kind][state.view];
      const columns = view.columns();
      const term = state.search.toLowerCase();
      const accessOf = (row) => (kind === 'property' ? row.getAccess : row.access);

      const rows = allRows
        .filter((row) => state.inherited || !row.inherited)
        .filter((row) => !state.publicOnly || (isPublic(accessOf(row)) && !row.hidden))
        .filter((row) => !term || Object.values(row).join(' ').toLowerCase().includes(term))
        .sort((left, right) => {
          const a = (left[state.sort] ?? '').toString().toLowerCase();
          const b = (right[state.sort] ?? '').toString().toLowerCase();
          return a > b ? state.order : (a < b ? -state.order : 0);
        });

      const header = columns.map(([key, label]) => (key === 'flags'
        ? `<th>${label}</th>`
        : `<th class="sortable-header" data-sort="${key}">${label} ↕</th>`)).join('');
      const renderRow = (row) => `<tr${row.inherited ? ' class="ref-inherited"' : ''}>${view.cells(row).map((cell) => `<td>${cell}</td>`).join('')}</tr>`;
      let body;
      if (!rows.length) {
        body = `<tr><td colspan="${columns.length}" style="text-align:center; color: var(--muted);">${kind === 'property' ? tr('No matching properties found.', '該当するプロパティなし。') : tr('No matching methods found.', '該当するメソッドなし。')}</td></tr>`;
      } else if (state.grouped && hasGroups(kind)) {
        body = groupRows(rows, 'Other', allRows).map((group) => `
          <tr class="ref-group-row"><th colspan="${columns.length}">${escapeHtml(groupLabel(group.name))} <span class="ref-muted">(${group.items.length})</span></th></tr>
          ${group.items.map(renderRow).join('')}`).join('');
      } else {
        body = rows.map(renderRow).join('');
      }

      const container = document.getElementById(`${kind}-table`);
      container.innerHTML = `
        <p class="ref-count">${tr(`${rows.length} of ${allRows.length} shown`, `${allRows.length} 件中 ${rows.length} 件を表示`)}</p>
        <div class="ref-table-scroll">
          <table class="compact-table ${kind === 'method' ? 'method-link-table' : 'description-table'}">
            <thead><tr>${header}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
      container.querySelectorAll('[data-sort]').forEach((th) => {
        th.addEventListener('click', () => {
          state.order = state.sort === th.dataset.sort ? -state.order : 1;
          state.sort = th.dataset.sort;
          renderMemberTable(kind);
        });
      });
    }

    function renderMemberToolbar(kind) {
      const state = memberState[kind];
      const views = kind === 'property'
        ? [['description', tr('Description', '説明')], ['type', tr('Details', '詳細')], ['attributes', tr('Meta Data', 'メタデータ')]]
        : [['description', tr('Description', '説明')], ['signature', tr('Signature', 'シグネチャ')], ['attributes', tr('Meta Data', 'メタデータ')]];
      return `
        <div class="ref-toolbar" data-kind="${kind}">
          <input type="search" class="search-box" placeholder="${kind === 'property' ? tr('Search properties...', 'プロパティを検索...') : tr('Search methods...', 'メソッドを検索...')}" value="${escapeHtml(state.search)}" autocomplete="off">
          ${hasGroups(kind) ? `<label class="ref-check"><input type="checkbox" data-option="grouped"${state.grouped ? ' checked' : ''}> ${tr('Group', 'グループ表示')}</label>` : ''}
          <label class="ref-check"><input type="checkbox" data-option="inherited"${state.inherited ? ' checked' : ''}> ${tr('Inherited', '継承メンバー')}</label>
          <label class="ref-check"><input type="checkbox" data-option="publicOnly"${state.publicOnly ? ' checked' : ''}> ${tr('Public only', 'public のみ')}</label>
        </div>
        <div class="view-switcher" data-kind="${kind}">
          ${views.map(([value, label]) => `<button type="button" class="view-btn${state.view === value ? ' active' : ''}" data-view="${value}">${label}</button>`).join('')}
        </div>
        <div id="${kind}-table"></div>`;
    }

    function bindMemberToolbar(kind) {
      const state = memberState[kind];
      const toolbar = document.querySelector(`.ref-toolbar[data-kind="${kind}"]`);
      const switcher = document.querySelector(`.view-switcher[data-kind="${kind}"]`);
      toolbar.querySelector('input[type="search"]').addEventListener('input', (event) => {
        state.search = event.target.value;
        renderMemberTable(kind);
      });
      toolbar.querySelectorAll('input[data-option]').forEach((input) => {
        input.addEventListener('change', () => {
          state[input.dataset.option] = input.checked;
          renderMemberTable(kind);
        });
      });
      switcher.querySelectorAll('[data-view]').forEach((button) => {
        button.addEventListener('click', () => {
          state.view = button.dataset.view;
          switcher.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b === button));
          renderMemberTable(kind);
        });
      });
      renderMemberTable(kind);
    }

    function renderClassPage(meta, classDoc) {
      const c = meta || {};
      const name = c.Name || className;
      pageData = {
        properties: (Array.isArray(classDoc.properties) ? classDoc.properties : []).map(normalizeProperty),
        methods: (Array.isArray(classDoc.methods) ? classDoc.methods : []).map(normalizeMethod)
      };
      const events = toList(classDoc.events);
      const enumeration = toList(classDoc.enumeration);
      const subclasses = loader.getSubclasses(name).map((item) => item.Name).sort();
      const ancestors = Array.isArray(c.Ancestors) ? c.Ancestors : loader.parentNames(c);
      const documented = c.Documented ?? Boolean(firstText(c.Summary, c.Desc));
      const category = firstText(c.Category, c.Package);
      const deprecated = firstText(c.Deprecated);
      setPageTitle(`GUILDA Reference - ${name}`, `GUILDA リファレンス - ${name}`);

      const badges = [
        c.Origin ? `<span class="ref-badge${c.Origin === 'User' ? ' is-user' : ''}" title="${tr('Source root', 'ソースのルート')}">${escapeHtml(c.Origin)}</span>` : '',
        category ? `<span class="ref-badge" title="${tr('Package', 'パッケージ')}">${tr('package', 'パッケージ')} ${escapeHtml(category)}</span>` : '',
        c.Type && !['auxiliary', 'other'].includes(c.Type) ? `<span class="ref-badge">${escapeHtml(c.Type === 'PowerSystemModel' && c.Model ? c.Model : c.Type)}</span>` : '',
        c.Abstract ? `<span class="ref-badge is-abstract">${tr('Abstract', '抽象クラス')}</span>` : '',
        c.Sealed ? '<span class="ref-badge is-sealed">Sealed</span>' : '',
        c.Hidden ? '<span class="ref-badge">Hidden</span>' : '',
        deprecated ? `<span class="ref-badge is-deprecated">${tr('Deprecated', '非推奨')}</span>` : '',
        documented ? '' : `<span class="ref-badge is-undocumented">${tr('Not documented yet', 'ドキュメント未整備')}</span>`
      ].join('');

      const chain = [name, ...ancestors].map((item, index) => (index === 0
        ? `<strong>${escapeHtml(item)}</strong>`
        : renderClassLink(item))).join('<span class="ref-chain-sep" aria-hidden="true">←</span>');
      const seeAlso = toList(c.SeeAlso);
      const examples = examplesText(c.Examples);
      const source = sourceLocation(c.File, c.Line);

      const sections = [];
      let html = `
        <div style="font-size: 0.9rem; color: var(--muted); margin-bottom: 10px;">
          <a href="${loader.pageUrl('index.html')}">${tr('Home', 'ホーム')}</a> &gt; <a href="${loader.pageUrl('index.html', 'tab-reference')}">${tr('Reference', 'リファレンス')}</a> &gt; ${escapeHtml(name)}
        </div>
        <h1 style="font-size: 2.2rem; margin-bottom: 8px; word-break: break-word;">${escapeHtml(name)}</h1>
        <div class="ref-badges">${badges}</div>
        ${source ? `<p class="ref-source">${tr('Source:', 'ソース:')} <code>${escapeHtml(source)}</code></p>` : ''}
      `;
      if (deprecated) {
        html += `<div class="ref-deprecated" role="note"><strong>${tr('Deprecated.', '非推奨。')}</strong>${/^(true|1)$/i.test(deprecated) ? '' : `<p>${nl2br(deprecated)}</p>`}</div>`;
      }
      if (!documented) {
        html += `<div class="ref-notice">${tr('This class has no documentation comments yet. The tables below are generated from the source code. To add a description, follow the comment rules in <a href="developer/class-documentation.html">Class Documentation</a>.', 'このクラスのドキュメントコメントは未記入。以下の表はソースコードから生成。説明の追加時は <a href="developer/class-documentation.html">Class Documentation</a> のコメント規約に準拠。')}</div>`;
      }
      [
        ['summary', tr('Summary', '概要'), c.Summary],
        ['description', tr('Description', '説明'), c.Desc],
        ['examples', tr('Examples', '使用例'), examples]
      ].filter(([, , value]) => firstText(value)).forEach(([id, title, value]) => {
        sections.push([id, title]);
        html += `
          <div class="meta-box" style="margin-top: 16px;">
            <h2 id="${id}" style="margin-top: 0;">${title}</h2>
            <div class="markdown-content">${renderMarkdown(value)}</div>
          </div>`;
      });

      sections.push(['inheritance', tr('Inheritance', '継承')]);
      html += `
        <h2 id="inheritance">${tr('Inheritance', '継承')}</h2>
        <div class="meta-box">
          <table class="meta-table">
            <tbody>
              <tr><th style="width: 22%;">${tr('Superclasses', 'スーパークラス')}</th><td><div class="ref-chain">${chain}</div></td></tr>
              <tr><th>${tr('Subclasses', 'サブクラス')}</th><td>${subclasses.length ? `<div class="ref-chain">${subclasses.map(renderClassLink).join('<span class="ref-chain-sep">,</span>')}</div>` : muted(tr('None', 'なし'))}</td></tr>
            </tbody>
          </table>
        </div>`;

      sections.push(['properties', tr('Properties', 'プロパティ')]);
      html += `<h2 id="properties">${tr('Properties', 'プロパティ')}</h2>`;
      html += pageData.properties.length ? renderMemberToolbar('property') : `<p>${tr('No properties.', 'プロパティなし。')}</p>`;

      sections.push(['methods', tr('Methods', 'メソッド')]);
      html += `<h2 id="methods">${tr('Methods', 'メソッド')}</h2>`;
      html += pageData.methods.length ? renderMemberToolbar('method') : `<p>${tr('No methods.', 'メソッドなし。')}</p>`;

      if (events.length) {
        sections.push(['events', tr('Events', 'イベント')]);
        html += `<h2 id="events">${tr('Events', 'イベント')}</h2><p>${events.map((item) => `<code>${escapeHtml(item)}</code>`).join(', ')}</p>`;
      }
      if (enumeration.length) {
        sections.push(['enumeration', tr('Enumeration', '列挙')]);
        html += `<h2 id="enumeration">${tr('Enumeration', '列挙')}</h2><p>${enumeration.map((item) => `<code>${escapeHtml(item)}</code>`).join(', ')}</p>`;
      }
      if (seeAlso.length) {
        sections.push(['see-also', tr('See also', '関連項目')]);
        html += `<h2 id="see-also">${tr('See also', '関連項目')}</h2><p class="ref-see-also">${seeAlso.map((item) => seeAlsoLink(item, name, pageData.methods.map((m) => m.name))).join(', ')}</p>`;
      }

      document.getElementById('dynamic-content').innerHTML = html;
      document.getElementById('page-toc').innerHTML = sections.map(([id, title]) =>
        `<li><a href="#${id}" onclick="document.getElementById('${id}')?.scrollIntoView(); return false;">${title}</a></li>`).join('');
      if (pageData.properties.length) bindMemberToolbar('property');
      if (pageData.methods.length) bindMemberToolbar('method');
    }

    if (!className) {
      document.getElementById('dynamic-content').innerHTML = `<h1 style="color: var(--err);">${tr('Error: Class not specified', 'エラー: クラス未指定')}</h1><p>${tr('The URL must specify a class name.', 'URL にクラス名の指定が必要。')}</p>`;
    } else if (!loader.hasIndex()) {
      document.getElementById('dynamic-content').innerHTML = `
        <h1>${escapeHtml(className)}</h1>
        <div class="ref-empty"><p>${tr('The class reference has not been generated yet.', 'クラスリファレンスは未生成。')}</p><p>${tr('Run <code>GUILDA.doc</code> in MATLAB to build it.', 'MATLAB で <code>GUILDA.doc</code> を実行して生成。')}</p></div>`;
    } else {
      window.GuildaDocTree.mount(document.getElementById('source-tree'), {
        className: loader.findClass(className)?.Name || className
      });
      loader.loadClass(className)
        .then(({ meta, data }) => {
          renderClassPage(meta, data);
          document.addEventListener('guilda-langchange', () => renderClassPage(meta, data));
        })
        .catch((err) => {
          document.getElementById('dynamic-content').innerHTML = `
            <h1 style="color: var(--err);">${tr('Load Error', '読み込みエラー')}</h1>
            <p>${escapeHtml((err && err.message) ? err.message : err)}</p>
          `;
        });
    }
  </script>
</body>
</html>
