<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">From one-way power flow to a grid of many active players</title>
  <desc id="d">Left: a power plant sends power one way to homes. Right: wind turbines, homes with solar panels, a factory, a battery and a microgrid exchange power in both directions around a shared grid.</desc>
  <defs>
    <symbol id="house" viewBox="0 0 40 40">
      <path d="M4 19 L20 5 L36 19 V36 H4 Z" fill="#FFFFFF" stroke="#1B2127" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="16" y="24" width="8" height="12" rx="1.5" fill="#0059A7"/>
    </symbol>
    <symbol id="pvhouse" viewBox="0 0 40 40">
      <path d="M4 19 L20 5 L36 19 V36 H4 Z" fill="#FFFFFF" stroke="#1B2127" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M8 16.5 L18.5 7.8 L22 10.8 L11.5 19.5 Z" fill="#0059A7" stroke="#1B2127" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M11 15 L19 9.5 M14 17.5 L21.5 11.5" stroke="#C7D8EA" stroke-width="1"/>
      <rect x="16" y="24" width="8" height="12" rx="1.5" fill="#D9E021" stroke="#1B2127" stroke-width="1.5"/>
    </symbol>
    <symbol id="turbine" viewBox="0 0 40 60">
      <path d="M18.5 22 L17 58 H23 L21.5 22 Z" fill="#FFFFFF" stroke="#1B2127" stroke-width="2" stroke-linejoin="round"/>
      <g fill="#FFFFFF" stroke="#1B2127" stroke-width="2" stroke-linejoin="round">
        <path d="M20 20 C18 12 18.5 6 20 2 C21.5 6 22 12 20 20 Z"/>
        <path d="M20 20 C27 24 31.5 28 34 32 C29.5 31.5 24 28 20 20 Z"/>
        <path d="M20 20 C13 24 8.5 28 6 32 C10.5 31.5 16 28 20 20 Z"/>
      </g>
      <circle cx="20" cy="20" r="3" fill="#D9E021" stroke="#1B2127" stroke-width="2"/>
    </symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#0059A7"/>
    </marker>
  </defs>

  <!-- Before -->
  <rect x="8" y="8" width="320" height="284" rx="22" fill="#F5F6F7"/>
  <text x="32" y="44" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A6570" letter-spacing="1.5">BEFORE</text>
  <text x="32" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6570">One-way flow from big plants</text>
  <!-- ground -->
  <path d="M28 236 H308" stroke="#B5BEC7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- plant -->
  <circle cx="80" cy="104" r="10" fill="#DADFE4"/><circle cx="96" cy="92" r="13" fill="#DADFE4"/><circle cx="116" cy="86" r="9" fill="#DADFE4"/>
  <rect x="72" y="118" width="18" height="50" rx="2" fill="#B5BEC7" stroke="#1B2127" stroke-width="2.5"/>
  <path d="M44 236 V168 L70 152 V168 L96 152 V168 L122 152 V236 Z" fill="#DADFE4" stroke="#1B2127" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="56" y="190" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1B2127" stroke-width="2"/>
  <rect x="90" y="190" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1B2127" stroke-width="2"/>
  <!-- line -->
  <g stroke="#5A6570" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M150 140 L142 236 M150 140 L158 236 M143 160 H157 M140 150 H160"/>
    <path d="M200 140 L192 236 M200 140 L208 236 M193 160 H207 M190 150 H210"/>
  </g>
  <path d="M120 170 Q132 154 140 150 Q175 162 190 150 Q205 156 236 196" fill="none" stroke="#1B2127" stroke-width="2"/>
  <path d="M152 112 H186" stroke="#0059A7" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <use href="#house" x="216" y="182" width="56" height="56"/>
  <use href="#house" x="262" y="196" width="42" height="42"/>

  <!-- arrow between -->
  <circle cx="360" cy="150" r="22" fill="#FFFFFF" stroke="#DADFE4" stroke-width="2"/>
  <path d="M350 150 H368 M361 142 L369 150 L361 158" fill="none" stroke="#0059A7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ahead -->
  <rect x="392" y="8" width="320" height="284" rx="22" fill="#EEF3F8"/>
  <text x="416" y="44" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0059A7" letter-spacing="1.5">AHEAD</text>
  <text x="416" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5A6570">Many players, power both ways</text>
  <!-- sun -->
  <circle cx="676" cy="44" r="13" fill="#D9E021" stroke="#1B2127" stroke-width="2"/>
  <g stroke="#1B2127" stroke-width="2" stroke-linecap="round"><path d="M676 22 v-6 M676 66 v6 M654 44 h-6 M698 44 h6 M660 28 l-4 -4 M692 28 l4 -4 M660 60 l-4 4 M692 60 l4 4"/></g>
  <!-- spokes -->
  <g stroke="#0059A7" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="1 7">
    <path d="M552 176 L462 128"/>
    <path d="M552 176 L632 116"/>
    <path d="M552 176 L454 236"/>
    <path d="M552 176 L556 254"/>
    <path d="M552 176 L650 232"/>
  </g>
  <g fill="#D9E021" stroke="#1B2127" stroke-width="1.5">
    <circle cx="507" cy="152" r="4.5"/><circle cx="592" cy="146" r="4.5"/><circle cx="503" cy="206" r="4.5"/><circle cx="554" cy="215" r="4.5"/><circle cx="601" cy="204" r="4.5"/>
  </g>
  <!-- hub -->
  <circle cx="552" cy="176" r="24" fill="#0059A7" stroke="#1B2127" stroke-width="2.5"/>
  <path d="M556 162 L545 179 H553 L548 191 L561 172 H553 Z" fill="#D9E021" stroke="#1B2127" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- wind -->
  <use href="#turbine" x="420" y="74" width="44" height="66"/>
  <use href="#turbine" x="452" y="92" width="32" height="48"/>
  <!-- pv house -->
  <use href="#pvhouse" x="606" y="78" width="54" height="54"/>
  <!-- microgrid -->
  <circle cx="452" cy="242" r="34" fill="#FFFFFF" stroke="#0059A7" stroke-width="2" stroke-dasharray="5 5"/>
  <use href="#pvhouse" x="424" y="222" width="30" height="30"/>
  <use href="#house" x="450" y="226" width="26" height="26"/>
  <use href="#house" x="436" y="248" width="22" height="22"/>
  <!-- battery -->
  <rect x="538" y="244" width="36" height="24" rx="4" fill="#FFFFFF" stroke="#1B2127" stroke-width="2.5"/>
  <rect x="574" y="251" width="4" height="10" rx="1" fill="#1B2127"/>
  <rect x="542" y="248" width="9" height="16" rx="1.5" fill="#D9E021"/><rect x="553" y="248" width="9" height="16" rx="1.5" fill="#D9E021"/>
  <!-- factory -->
  <path d="M626 268 V230 L644 220 V230 L662 220 V230 L680 220 V268 Z" fill="#FFFFFF" stroke="#1B2127" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="664" y="198" width="10" height="24" fill="#B5BEC7" stroke="#1B2127" stroke-width="2"/>
  <rect x="636" y="244" width="10" height="10" rx="1.5" fill="#0059A7"/><rect x="656" y="244" width="10" height="10" rx="1.5" fill="#0059A7"/>
</svg>
