<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUILDA Reference - Method</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reference.css">

  <script src="./database/list_Classes.js"></script>
  <script src="./doc-loader.js"></script>
  <script src="./doc-render.js"></script>
  <script src="./doc-tree.js"></script>
</head>
<body class="doc-layout">

  <nav id="sidebar" style="padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <a href="index.html" onclick="window.GuildaDocLoader.navigate('index.html'); return false;" style="display: block; margin-bottom: 20px;">
      <img src="./images/GUILDAicon.png" alt="GUILDA Logo" style="width: 100%;">
    </a>

    <div id="sidebar-back-btn"></div>

    <div id="source-tree"></div>

    <h3 style="margin-top: 0;">On this page</h3>
    <ul id="page-toc" style="list-style: none; padding-left: 0; font-size: 0.9rem; line-height: 1.8;"></ul>
    <div id="sidebar-method-nav"></div>
  </nav>

  <main id="main-content" style="flex: 1; min-width: 0;">
    <div id="dynamic-content">
      <h1 style="color: var(--muted);">Loading...</h1>
    </div>
  </main>

  <script>
    const loader = window.GuildaDocLoader;
    const {
      escapeHtml, nl2br, firstText, toList, formatInlineMarkdown, renderMarkdown,
      classLink, seeAlsoLink, sourceLocation, examplesText, groupRows
    } = window.GuildaDocRender;
    const routeParams = loader.getRouteParams();
    const className = routeParams.get('class');
    const methodName = routeParams.get('method');

    const muted = (text) => `<span class="ref-muted">${text}</span>`;
    const cell = (value, fallback = muted('-')) => {
      const text = (value ?? '').toString().trim();
      return text ? escapeHtml(text) : fallback;
    };
    const KIND_LABELS = { Positional: 'Positional', NameValue: 'Name-Value', Repeating: 'Repeating', Output: 'Output' };
    const IMPLEMENTED_IN_LABELS = {
      classdef: 'classdef file',
      file: 'own file in the class folder',
      private: 'private folder of the class'
    };

    if (!className || !methodName) {
      document.getElementById('dynamic-content').innerHTML = "<h1 style='color: var(--err);'>Error: Missing Parameters</h1>";
    } else if (!loader.hasIndex()) {
      document.getElementById('dynamic-content').innerHTML = `
        <h1>${escapeHtml(methodName)}</h1>
        <div class="ref-empty"><p>The class reference has not been generated yet.</p><p>Run <code>GUILDA.doc</code> in MATLAB to build it.</p></div>`;
    } else {
      document.getElementById('sidebar-back-btn').innerHTML = `
        <a href="${loader.pageUrl('class.html', { class: className })}" class="btn" style="width: 100%; text-align: center; margin-bottom: 20px; box-sizing: border-box;">← Back to ${escapeHtml(className)}</a>
      `;

      loader.loadClass(className)
        .then(({ meta, data }) => {
          const ownerName = meta?.Name || className;
          const raw = findMethod(data, methodName);
          window.GuildaDocTree.mount(document.getElementById('source-tree'), {
            className: ownerName,
            methodName: raw?.Name || methodName,
            definingClass: raw?.Defining || '',
            file: raw?.File || ''
          });
          renderMethodNav(ownerName, raw?.Name || methodName, data);
          renderMethodPage(ownerName, raw, (data?.methods || []).map((method) => method.Name));
        })
        .catch((err) => {
          document.getElementById('dynamic-content').innerHTML = `<h1 style="color: var(--err);">Load Error</h1><p>${escapeHtml((err && err.message) ? err.message : err)}</p>`;
        });
    }

    function findMethod(classDoc, name) {
      const methods = Array.isArray(classDoc?.methods) ? classDoc.methods : [];
      return methods.find((method) => method?.Name === name)
        || methods.find((method) => (method?.Name || '').toLowerCase() === name.toLowerCase())
        || null;
    }

    // Sidebar list of the other methods of the class: by group when the
    // data has groups, own methods first within each list.
    function renderMethodNav(ownerName, currentName, classDoc) {
      const methods = (Array.isArray(classDoc?.methods) ? classDoc.methods : [])
        .slice()
        .sort((a, b) => ((a.Defining !== ownerName) - (b.Defining !== ownerName)) || a.Name.localeCompare(b.Name))
        .map((m) => ({ method: m, group: m.Group || (m.IsConstructor ? 'Constructor' : '') }));
      if (!methods.length) return;
      const item = ({ method: m }) => `<li><a class="${m.Name === currentName ? 'is-current' : ''}${m.Defining !== ownerName ? ' ref-muted' : ''}"${m.Name === currentName ? ' aria-current="page"' : ''} href="${loader.pageUrl('method.html', { class: ownerName, method: m.Name })}">${escapeHtml(m.Name)}</a></li>`;
      const grouped = methods.some((row) => row.group);
      document.getElementById('sidebar-method-nav').innerHTML = `
        <h3 class="ref-nav-title">Methods of ${escapeHtml(ownerName)}</h3>
        ${grouped
          ? groupRows(methods, 'Other').map((group) => `
              <p class="ref-muted" style="margin: 8px 0 2px; font-size: 0.75rem;">${escapeHtml(group.name)}</p>
              <ul class="ref-method-nav" style="margin-bottom: 6px;">${group.items.map(item).join('')}</ul>`).join('')
          : `<ul class="ref-method-nav">${methods.map(item).join('')}</ul>`}`;
    }

    // Input rows come from the arguments block of the source (v5 adds the
    // descriptions there). Schema v4 may also have <@Parameters> rows.
    function inputRows(m) {
      const sourceArguments = (Array.isArray(m.Arguments) ? m.Arguments : []).filter((arg) => arg?.Kind !== 'Output');
      const tagged = new Map((Array.isArray(m.Parameters) ? m.Parameters : [])
        .map((p) => [p?.Name || p?.name || '', p]).filter(([name]) => name));
      const rows = sourceArguments.map((arg) => {
        const tag = tagged.get(arg.Name) || {};
        tagged.delete(arg.Name);
        return {
          name: arg.Name || '',
          kind: KIND_LABELS[arg.Kind] || arg.Kind || '',
          type: firstText(tag.Type, [arg.Size, arg.Class].filter(Boolean).join(' ')),
          unit: firstText(arg.Unit, tag.Unit),
          description: firstText(arg.Description, tag.Description),
          required: arg.Required,
          default: firstText(arg.Default, tag.Default),
          validators: firstText(toList(arg.Validators).join(', '), tag.Constraints)
        };
      });
      tagged.forEach((tag, name) => rows.push({
        name, kind: '', type: tag.Type || '', unit: tag.Unit || '', description: tag.Description || '',
        required: tag.Required, default: tag.Default || '', validators: tag.Constraints || ''
      }));
      if (rows.length) return rows;
      return toList(m.InputNames).map((name) => ({
        name, kind: name === 'varargin' ? 'Repeating' : '', type: '', unit: '', description: '', required: undefined, default: '', validators: ''
      }));
    }

    // Output rows: Outputs (v5), Kind "Output" entries in Arguments, then
    // <@Returns> (v4), then the names on the function line.
    function outputRows(m) {
      const outputs = Array.isArray(m.Outputs) && m.Outputs.length
        ? m.Outputs
        : (Array.isArray(m.Arguments) ? m.Arguments : []).filter((arg) => arg?.Kind === 'Output');
      const fromReturns = Array.isArray(m.Returns) ? m.Returns : [];
      const source = outputs.length ? outputs : fromReturns;
      const rows = source.map((r) => ({
        name: r?.Name || r?.name || '',
        type: firstText(r?.Type, [r?.Size, r?.Class].filter(Boolean).join(' ')),
        unit: r?.Unit || '',
        description: r?.Description || r?.description || ''
      })).filter((r) => r.name || r.description);
      if (rows.length) return rows;
      return toList(m.OutputNames).map((name) => ({ name, type: '', unit: '', description: '' }));
    }

    function renderInputTable(rows) {
      const withUnit = rows.some((p) => p.unit);
      return `
        <div class="ref-table-scroll"><table class="compact-table description-table">
          <thead><tr>
            <th>Name</th><th>Kind</th><th>Size / Class</th>${withUnit ? '<th>Unit</th>' : ''}
            <th>Description</th><th>Required</th><th>Default</th><th>Validators</th>
          </tr></thead>
          <tbody>
            ${rows.map((p) => `
              <tr>
                <td><strong>${cell(p.name)}</strong></td>
                <td>${cell(p.kind, 'Positional')}</td>
                <td>${cell(p.type)}</td>
                ${withUnit ? `<td>${p.unit ? `<span class="ref-unit">${escapeHtml(p.unit)}</span>` : muted('-')}</td>` : ''}
                <td>${p.description ? formatInlineMarkdown(p.description) : muted('-')}</td>
                <td>${typeof p.required === 'boolean' ? (p.required ? 'Required' : 'Optional') : cell(p.required)}</td>
                <td>${p.default ? `<span class="ref-code">${escapeHtml(p.default)}</span>` : muted('-')}</td>
                <td>${cell(p.validators)}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;
    }

    function renderOutputTable(rows) {
      const withUnit = rows.some((r) => r.unit);
      const withType = rows.some((r) => r.type);
      return `
        <div class="ref-table-scroll"><table class="compact-table description-table">
          <thead><tr>
            <th>Name</th>${withType ? '<th>Size / Class</th>' : ''}${withUnit ? '<th>Unit</th>' : ''}<th>Description</th>
          </tr></thead>
          <tbody>
            ${rows.map((r) => `
              <tr>
                <td><strong>${cell(r.name)}</strong></td>
                ${withType ? `<td>${cell(r.type)}</td>` : ''}
                ${withUnit ? `<td>${r.unit ? `<span class="ref-unit">${escapeHtml(r.unit)}</span>` : muted('-')}</td>` : ''}
                <td>${r.description ? formatInlineMarkdown(r.description) : muted('-')}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;
    }

    // Throws is a list of error IDs in v5 and free text in v4.
    function renderThrows(raw) {
      if (Array.isArray(raw)) {
        const ids = toList(raw);
        return ids.length ? `<ul>${ids.map((id) => `<li><code>${escapeHtml(id)}</code></li>`).join('')}</ul>` : '';
      }
      return firstText(raw) ? `<div class="markdown-content">${renderMarkdown(raw)}</div>` : '';
    }

    function renderMethodPage(ownerName, m, methodNames) {
      const container = document.getElementById('dynamic-content');
      if (!m) {
        container.innerHTML = `<h1 style="color: var(--err);">Method not found</h1><p>${escapeHtml(methodName)} does not exist in ${escapeHtml(ownerName)}.</p>`;
        return;
      }
      const name = m.Name;
      const defining = m.Defining || '';
      const group = m.Group || (m.IsConstructor ? 'Constructor' : '');
      const deprecated = firstText(m.Deprecated);
      const signatures = m.Signature ? [m.Signature] : toList(m.Signatures);
      if (!signatures.length) signatures.push(`${name}()`);
      const inputs = inputRows(m);
      const outputs = outputRows(m);
      const throwsHtml = renderThrows(m.Throws);
      const examples = examplesText(m.Examples);
      const seeAlso = toList(m.SeeAlso);
      const source = sourceLocation(m.File, m.Line);
      const hasDocs = Boolean(firstText(m.Summary, m.Desc));
      document.title = `GUILDA Reference - ${ownerName}.${name}`;

      const badges = [
        group ? `<span class="ref-badge" title="Method group">${escapeHtml(group)}</span>` : '',
        m.Access && m.Access !== 'public' ? `<span class="ref-badge">${escapeHtml(m.Access)}</span>` : '',
        m.Static ? '<span class="ref-badge">Static</span>' : '',
        m.Abstract ? '<span class="ref-badge is-abstract">Abstract</span>' : '',
        m.Sealed ? '<span class="ref-badge is-sealed">Sealed</span>' : '',
        m.Hidden ? '<span class="ref-badge">Hidden</span>' : '',
        deprecated ? '<span class="ref-badge is-deprecated">Deprecated</span>' : ''
      ].join('');
      const origin = defining && defining !== ownerName
        ? `Inherited from ${classLink(defining)}.`
        : (defining ? `Method defined in the ${classLink(defining)} class.` : '');
      const overrides = m.Overrides
        ? ` Overrides <a href="${loader.pageUrl('method.html', { class: m.Overrides, method: name })}">${escapeHtml(m.Overrides)}.${escapeHtml(name)}</a>.`
        : '';

      const sections = [];
      const section = (id, title, body) => {
        sections.push([id, title]);
        return `<h2 id="${id}">${title}</h2>${body}`;
      };

      let html = `
        <div style="font-size: 0.9rem; color: var(--muted); margin-bottom: 10px;">
          <a href="${loader.pageUrl('index.html')}">Home</a> &gt; <a href="${loader.pageUrl('class.html', { class: ownerName })}">${escapeHtml(ownerName)}</a> &gt; ${escapeHtml(name)}
        </div>
        <h1 style="font-size: 2.5rem; margin-bottom: 10px; word-break: break-word;">${escapeHtml(name)}</h1>
        ${badges ? `<div class="ref-badges">${badges}</div>` : ''}
        <div style="margin: -4px 0 10px 0; color: var(--muted); font-size: 0.95rem;">${origin}${overrides}</div>
        ${source ? `<p class="ref-source">Source: <code>${escapeHtml(source)}</code></p>` : ''}
        ${deprecated ? `<div class="ref-deprecated" role="note"><strong>Deprecated.</strong>${/^(true|1)$/i.test(deprecated) ? '' : `<p>${nl2br(deprecated)}</p>`}</div>` : ''}
        ${hasDocs ? '' : `<div class="ref-notice">This method has no documentation comments yet. Signature and arguments below are read from the source code. See <a href="developer/class-documentation.html">Class Documentation</a> for the comment rules.</div>`}
        <hr style="margin: 0 0 18px 0; border: 0; border-top: 1px solid var(--line);">
      `;

      if (firstText(m.Summary)) {
        html += section('overview', 'Overview', `<div class="meta-box"><div class="markdown-content">${renderMarkdown(m.Summary)}</div></div>`);
      }
      html += section('signature', 'Signature', `<div class="syntax-box"><pre><code>${escapeHtml(signatures.join('\n'))}</code></pre></div>`);
      if (firstText(m.Desc)) {
        html += section('description', 'Description', `<div class="meta-box"><div class="markdown-content">${renderMarkdown(m.Desc)}</div></div>`);
      }
      html += section('inputs', 'Input Arguments', inputs.length ? renderInputTable(inputs) : '<p>None</p>');
      html += section('outputs', 'Output Arguments', outputs.length ? renderOutputTable(outputs) : '<p>None</p>');
      if (throwsHtml) {
        html += section('throws', 'Errors', `<div class="meta-box">${throwsHtml}</div>`);
      }
      if (examples) {
        html += section('examples', 'Examples', `<div class="meta-box"><div class="example-block markdown-content">${renderMarkdown(examples)}</div></div>`);
      }
      if (seeAlso.length) {
        html += section('see-also', 'See also', `<p class="ref-see-also">${seeAlso.map((item) => seeAlsoLink(item, ownerName, methodNames)).join(', ')}</p>`);
      }

      const yesNo = (value) => (value ? 'Yes' : 'No');
      html += section('metadata', 'Method Metadata', `
        <div class="meta-box">
          <table class="meta-table">
            <tbody>
              <tr><th style="width: 22%;">Defining Class</th><td>${defining ? classLink(defining) : 'N/A'}</td></tr>
              <tr><th>Overrides</th><td>${m.Overrides ? classLink(m.Overrides) : muted('-')}</td></tr>
              <tr><th>Implemented in</th><td>${cell(IMPLEMENTED_IN_LABELS[m.ImplementedIn] || m.ImplementedIn)}</td></tr>
              <tr><th>Group</th><td>${cell(group)}</td></tr>
              <tr><th>Access</th><td>${cell(m.Access, 'N/A')}</td></tr>
              <tr><th>Static</th><td>${yesNo(m.Static)}</td></tr>
              <tr><th>Abstract</th><td>${yesNo(m.Abstract)}</td></tr>
              <tr><th>Sealed</th><td>${yesNo(m.Sealed)}</td></tr>
              <tr><th>Constructor</th><td>${yesNo(m.IsConstructor)}</td></tr>
              <tr><th>Hidden</th><td>${yesNo(m.Hidden)}</td></tr>
            </tbody>
          </table>
        </div>`);

      container.innerHTML = html;
      document.getElementById('page-toc').innerHTML = sections.map(([id, title]) =>
        `<li><a href="#${id}" onclick="document.getElementById('${id}')?.scrollIntoView(); return false;">${title}</a></li>`).join('');
    }
  </script>
</body>
</html>
