<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-title-ja="GUILDA リファレンス - メソッド">GUILDA Reference - Method</title>
  <script src="doc-lang.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reference.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">

  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./database/list_Classes.js"></script>
  <script src="./doc-loader.js"></script>
  <script src="./doc-render.js"></script>
  <script src="./doc-tree.js"></script>
</head>
<body class="doc-layout">

  <nav id="sidebar" style="padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <a href="index.html" onclick="window.GuildaDocLoader.navigate('index.html'); return false;" style="display: block; margin-bottom: 20px;">
      <img src="./images/GUILDAicon.png" alt="GUILDA Logo" style="width: 100%;">
    </a>

    <div id="sidebar-back-btn"></div>

    <div id="source-tree"></div>

    <h3 style="margin-top: 0;"><span lang="en">On this page</span><span lang="ja">このページの内容</span></h3>
    <ul id="page-toc" style="list-style: none; padding-left: 0; font-size: 0.9rem; line-height: 1.8;"></ul>
    <div id="sidebar-method-nav"></div>
  </nav>

  <main id="main-content" style="flex: 1; min-width: 0;">
    <div id="dynamic-content">
      <h1 style="color: var(--muted);"><span lang="en">Loading...</span><span lang="ja">読み込み中...</span></h1>
    </div>
  </main>

  <script>
    const loader = window.GuildaDocLoader;
    const {
      tr, setPageTitle, escapeHtml, nl2br, firstText, toList, formatInlineMarkdown, renderMarkdown,
      classLink, seeAlsoLink, sourceLocation, examplesText, groupRows, groupHeading, breakableName
    } = window.GuildaDocRender;
    const routeParams = loader.getRouteParams();
    const className = routeParams.get('class');
    const methodName = routeParams.get('method');

    const muted = (text) => `<span class="ref-muted">${text}</span>`;
    const cell = (value, fallback = muted('-')) => {
      const text = (value ?? '').toString().trim();
      return text ? escapeHtml(text) : fallback;
    };
    const KIND_LABELS = {
      Positional: ['Positional', '位置引数'], NameValue: ['Name-Value', '名前と値の引数'],
      Repeating: ['Repeating', '繰り返し引数'], Output: ['Output', '出力']
    };
    const IMPLEMENTED_IN_LABELS = {
      classdef: ['classdef file', 'classdef ファイル'],
      file: ['own file in the class folder', 'クラスフォルダ内の個別ファイル'],
      private: ['private folder of the class', 'クラスの private フォルダ']
    };
    const kindLabel = (kind) => (KIND_LABELS[kind] ? tr(...KIND_LABELS[kind]) : kind);
    // Group names written by the generator; other group names come from the source comments.
    const groupLabel = (name) => ({ Constructor: tr('Constructor', 'コンストラクタ'), Other: tr('Other', 'その他') })[name] || name;

    if (!className || !methodName) {
      document.getElementById('dynamic-content').innerHTML = `<h1 style="color: var(--err);">${tr('Error: Missing Parameters', 'エラー: パラメーター不足')}</h1>`;
    } else if (!loader.hasIndex()) {
      document.getElementById('dynamic-content').innerHTML = `
        <h1>${escapeHtml(methodName)}</h1>
        <div class="ref-empty"><p>${tr('The class reference has not been generated yet.', 'クラスリファレンスは未生成。')}</p><p>${tr('Run <code>GUILDA.doc</code> in MATLAB to build it.', 'MATLAB で <code>GUILDA.doc</code> を実行して生成。')}</p></div>`;
    } else {
      document.getElementById('sidebar-back-btn').innerHTML = `
        <a href="${loader.pageUrl('class.html', { class: className })}" class="btn" style="width: 100%; text-align: center; margin-bottom: 20px; box-sizing: border-box;"><span lang="en">← Back to ${escapeHtml(className)}</span><span lang="ja">← ${escapeHtml(className)} に戻る</span></a>
      `;

      loader.loadClass(className)
        .then(({ meta, data }) => {
          const ownerName = meta?.Name || className;
          const raw = findMethod(data, methodName);
          window.GuildaDocTree.mount(document.getElementById('source-tree'), {
            className: ownerName,
            methodName: raw?.Name || methodName,
            definingClass: raw?.Defining || '',
            file: raw?.File || ''
          });
          const render = () => {
            renderMethodNav(ownerName, raw?.Name || methodName, data);
            renderMethodPage(ownerName, raw, (data?.methods || []).map((method) => method.Name));
          };
          render();
          document.addEventListener('guilda-langchange', render);
        })
        .catch((err) => {
          document.getElementById('dynamic-content').innerHTML = `<h1 style="color: var(--err);">${tr('Load Error', '読み込みエラー')}</h1><p>${escapeHtml((err && err.message) ? err.message : err)}</p>`;
        });
    }

    function findMethod(classDoc, name) {
      const methods = Array.isArray(classDoc?.methods) ? classDoc.methods : [];
      return methods.find((method) => method?.Name === name)
        || methods.find((method) => (method?.Name || '').toLowerCase() === name.toLowerCase())
        || null;
    }

    // Sidebar list of the other methods of the class: by group when the
    // data has groups, own methods first within each list.
    function renderMethodNav(ownerName, currentName, classDoc) {
      const methods = (Array.isArray(classDoc?.methods) ? classDoc.methods : [])
        .slice()
        .sort((a, b) => ((a.Defining !== ownerName) - (b.Defining !== ownerName)) || a.Name.localeCompare(b.Name))
        .map((m) => ({ method: m, group: m.Group || (m.IsConstructor ? 'Constructor' : '') }));
      if (!methods.length) return;
      const item = ({ method: m }) => `<li><a class="${m.Name === currentName ? 'is-current' : ''}${m.Defining !== ownerName ? ' ref-muted' : ''}"${m.Name === currentName ? ' aria-current="page"' : ''} href="${loader.pageUrl('method.html', { class: ownerName, method: m.Name })}">${escapeHtml(m.Name)}</a></li>`;
      const grouped = methods.some((row) => row.group);
      document.getElementById('sidebar-method-nav').innerHTML = `
        <h3 class="ref-nav-title">${tr(`Methods of ${escapeHtml(ownerName)}`, `${escapeHtml(ownerName)} のメソッド`)}</h3>
        ${grouped
          ? groupRows(methods, 'Other').map((group) => `
              <p class="ref-nav-group">${groupHeading(groupLabel(group.name), group.items.length)}</p>
              <ul class="ref-method-nav" style="margin-bottom: 6px;">${group.items.map(item).join('')}</ul>`).join('')
          : `<ul class="ref-method-nav">${methods.map(item).join('')}</ul>`}`;
    }

    // Input rows come from the arguments block of the source (schema v5 adds
    // the descriptions there). Schema v4 may also have <@Parameters> rows.
    function inputRows(m) {
      const sourceArguments = (Array.isArray(m.Arguments) ? m.Arguments : []).filter((arg) => arg?.Kind !== 'Output');
      const tagged = new Map((Array.isArray(m.Parameters) ? m.Parameters : [])
        .map((p) => [p?.Name || p?.name || '', p]).filter(([name]) => name));
      const rows = sourceArguments.map((arg) => {
        const tag = tagged.get(arg.Name) || {};
        tagged.delete(arg.Name);
        return {
          name: arg.Name || '',
          kind: arg.Kind || '',
          type: firstText(tag.Type, [arg.Size, arg.Class].filter(Boolean).join(' ')),
          unit: firstText(arg.Unit, tag.Unit),
          description: firstText(arg.Description, tag.Description),
          required: arg.Required,
          default: firstText(arg.Default, tag.Default),
          validators: firstText(toList(arg.Validators).join(', '), tag.Constraints)
        };
      });
      tagged.forEach((tag, name) => rows.push({
        name, kind: '', type: tag.Type || '', unit: tag.Unit || '', description: tag.Description || '',
        required: tag.Required, default: tag.Default || '', validators: tag.Constraints || ''
      }));
      if (rows.length) return rows;
      return toList(m.InputNames).map((name) => ({
        name, kind: name === 'varargin' ? 'Repeating' : '', type: '', unit: '', description: '', required: undefined, default: '', validators: ''
      }));
    }

    // Output rows: Outputs (schema v5), Kind "Output" entries in Arguments, then
    // <@Returns> (schema v4), then the names on the function line.
    function outputRows(m) {
      const outputs = Array.isArray(m.Outputs) && m.Outputs.length
        ? m.Outputs
        : (Array.isArray(m.Arguments) ? m.Arguments : []).filter((arg) => arg?.Kind === 'Output');
      const fromReturns = Array.isArray(m.Returns) ? m.Returns : [];
      const source = outputs.length ? outputs : fromReturns;
      const rows = source.map((r) => ({
        name: r?.Name || r?.name || '',
        type: firstText(r?.Type, [r?.Size, r?.Class].filter(Boolean).join(' ')),
        unit: r?.Unit || '',
        description: r?.Description || r?.description || ''
      })).filter((r) => r.name || r.description);
      if (rows.length) return rows;
      return toList(m.OutputNames).map((name) => ({ name, type: '', unit: '', description: '' }));
    }

    function renderInputTable(rows) {
      const withUnit = rows.some((p) => p.unit);
      return `
        <div class="ref-table-scroll"><table class="compact-table description-table">
          <thead><tr>
            <th>${tr('Name', '名前')}</th><th>${tr('Kind', '種類')}</th><th>${tr('Size / Class', 'サイズ / クラス')}</th>${withUnit ? `<th class="col-unit">${tr('Unit', '単位')}</th>` : ''}
            <th class="col-description">${tr('Description', '説明')}</th><th>${tr('Required', '必須')}</th><th>${tr('Default', '既定値')}</th><th>${tr('Validators', '検証関数')}</th>
          </tr></thead>
          <tbody>
            ${rows.map((p) => `
              <tr>
                <td class="col-name"><strong>${p.name ? breakableName(p.name) : muted('-')}</strong></td>
                <td>${cell(kindLabel(p.kind || 'Positional'))}</td>
                <td>${cell(p.type)}</td>
                ${withUnit ? `<td class="col-unit">${p.unit ? `<span class="ref-unit">${escapeHtml(p.unit)}</span>` : muted('-')}</td>` : ''}
                <td class="col-description">${p.description ? formatInlineMarkdown(p.description) : muted('-')}</td>
                <td>${typeof p.required === 'boolean' ? (p.required ? tr('Required', '必須') : tr('Optional', '任意')) : cell(p.required)}</td>
                <td>${p.default ? `<span class="ref-code">${escapeHtml(p.default)}</span>` : muted('-')}</td>
                <td>${cell(p.validators)}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;
    }

    function renderOutputTable(rows) {
      const withUnit = rows.some((r) => r.unit);
      const withType = rows.some((r) => r.type);
      return `
        <div class="ref-table-scroll"><table class="compact-table description-table">
          <thead><tr>
            <th>${tr('Name', '名前')}</th>${withType ? `<th>${tr('Size / Class', 'サイズ / クラス')}</th>` : ''}${withUnit ? `<th class="col-unit">${tr('Unit', '単位')}</th>` : ''}<th class="col-description">${tr('Description', '説明')}</th>
          </tr></thead>
          <tbody>
            ${rows.map((r) => `
              <tr>
                <td class="col-name"><strong>${r.name ? breakableName(r.name) : muted('-')}</strong></td>
                ${withType ? `<td>${cell(r.type)}</td>` : ''}
                ${withUnit ? `<td class="col-unit">${r.unit ? `<span class="ref-unit">${escapeHtml(r.unit)}</span>` : muted('-')}</td>` : ''}
                <td class="col-description">${r.description ? formatInlineMarkdown(r.description) : muted('-')}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>`;
    }

    // Throws is a list of error IDs in schema v5 and free text in schema v4.
    function renderThrows(raw) {
      if (Array.isArray(raw)) {
        const ids = toList(raw);
        return ids.length ? `<ul>${ids.map((id) => `<li><code>${escapeHtml(id)}</code></li>`).join('')}</ul>` : '';
      }
      return firstText(raw) ? `<div class="markdown-content">${renderMarkdown(raw)}</div>` : '';
    }

    function renderMethodPage(ownerName, m, methodNames) {
      const container = document.getElementById('dynamic-content');
      if (!m) {
        container.innerHTML = `<h1 style="color: var(--err);">${tr('Method not found', '該当するメソッドなし')}</h1><p>${tr(`${escapeHtml(methodName)} does not exist in ${escapeHtml(ownerName)}.`, `${escapeHtml(ownerName)} に ${escapeHtml(methodName)} の定義なし。`)}</p>`;
        return;
      }
      const name = m.Name;
      const defining = m.Defining || '';
      const group = m.Group || (m.IsConstructor ? 'Constructor' : '');
      const deprecated = firstText(m.Deprecated);
      const signatures = m.Signature ? [m.Signature] : toList(m.Signatures);
      if (!signatures.length) signatures.push(`${name}()`);
      const inputs = inputRows(m);
      const outputs = outputRows(m);
      const throwsHtml = renderThrows(m.Throws);
      const examples = examplesText(m.Examples);
      const seeAlso = toList(m.SeeAlso);
      const source = sourceLocation(m.File, m.Line);
      const hasDocs = Boolean(firstText(m.Summary, m.Desc));
      setPageTitle(`GUILDA Reference - ${ownerName}.${name}`, `GUILDA リファレンス - ${ownerName}.${name}`);

      const badges = [
        group ? `<span class="ref-badge" title="${tr('Method group', 'メソッドグループ')}">${escapeHtml(groupLabel(group))}</span>` : '',
        m.Access && m.Access !== 'public' ? `<span class="ref-badge">${escapeHtml(m.Access)}</span>` : '',
        m.Static ? '<span class="ref-badge">Static</span>' : '',
        m.Abstract ? `<span class="ref-badge is-abstract">${tr('Abstract', '抽象メソッド')}</span>` : '',
        m.Sealed ? '<span class="ref-badge is-sealed">Sealed</span>' : '',
        m.Hidden ? '<span class="ref-badge">Hidden</span>' : '',
        deprecated ? `<span class="ref-badge is-deprecated">${tr('Deprecated', '非推奨')}</span>` : ''
      ].join('');
      const origin = defining && defining !== ownerName
        ? tr(`Inherited from ${classLink(defining)}.`, `${classLink(defining)} から継承。`)
        : (defining ? tr(`Method defined in the ${classLink(defining)} class.`, `${classLink(defining)} クラスで定義されたメソッド。`) : '');
      const overrides = m.Overrides
        ? tr(` Overrides <a href="${loader.pageUrl('method.html', { class: m.Overrides, method: name })}">${escapeHtml(m.Overrides)}.${escapeHtml(name)}</a>.`,
          ` <a href="${loader.pageUrl('method.html', { class: m.Overrides, method: name })}">${escapeHtml(m.Overrides)}.${escapeHtml(name)}</a> をオーバーライド。`)
        : '';

      const sections = [];
      const section = (id, title, body) => {
        sections.push([id, title]);
        return `<h2 id="${id}">${title}</h2>${body}`;
      };

      let html = `
        <div style="font-size: 0.9rem; color: var(--muted); margin-bottom: 10px;">
          <a href="${loader.pageUrl('index.html')}">${tr('Home', 'ホーム')}</a> &gt; <a href="${loader.pageUrl('class.html', { class: ownerName })}">${escapeHtml(ownerName)}</a> &gt; ${escapeHtml(name)}
        </div>
        <h1 style="font-size: 2.5rem; margin-bottom: 10px; word-break: break-word;">${escapeHtml(name)}</h1>
        ${badges ? `<div class="ref-badges">${badges}</div>` : ''}
        <div style="margin: -4px 0 10px 0; color: var(--muted); font-size: 0.95rem;">${origin}${overrides}</div>
        ${source ? `<p class="ref-source">${tr('Source:', 'ソース:')} <code>${escapeHtml(source)}</code></p>` : ''}
        ${deprecated ? `<div class="ref-deprecated" role="note"><strong>${tr('Deprecated.', '非推奨。')}</strong>${/^(true|1)$/i.test(deprecated) ? '' : `<p>${nl2br(deprecated)}</p>`}</div>` : ''}
        ${hasDocs ? '' : `<div class="ref-notice">${tr('This method has no documentation comments yet. Signature and arguments below are read from the source code. See <a href="developer/class-documentation.html">Class Documentation</a> for the comment rules.', 'このメソッドのドキュメントコメントは未記入。以下のシグネチャと引数はソースコードから読み取り。コメント規約は <a href="developer/class-documentation.html">Class Documentation</a> を参照。')}</div>`}
        <hr style="margin: 0 0 18px 0; border: 0; border-top: 1px solid var(--line);">
      `;

      if (firstText(m.Summary)) {
        html += section('overview', tr('Overview', '概要'), `<div class="meta-box"><div class="markdown-content">${renderMarkdown(m.Summary)}</div></div>`);
      }
      html += section('signature', tr('Signature', 'シグネチャ'), `<div class="syntax-box"><pre><code>${escapeHtml(signatures.join('\n'))}</code></pre></div>`);
      if (firstText(m.Desc)) {
        html += section('description', tr('Description', '説明'), `<div class="meta-box"><div class="markdown-content">${renderMarkdown(m.Desc)}</div></div>`);
      }
      html += section('inputs', tr('Input Arguments', '入力引数'), inputs.length ? renderInputTable(inputs) : `<p>${tr('None', 'なし')}</p>`);
      html += section('outputs', tr('Output Arguments', '出力引数'), outputs.length ? renderOutputTable(outputs) : `<p>${tr('None', 'なし')}</p>`);
      if (throwsHtml) {
        html += section('throws', tr('Errors', 'エラー'), `<div class="meta-box">${throwsHtml}</div>`);
      }
      if (examples) {
        html += section('examples', tr('Examples', '使用例'), `<div class="meta-box"><div class="example-block markdown-content">${renderMarkdown(examples)}</div></div>`);
      }
      if (seeAlso.length) {
        html += section('see-also', tr('See also', '関連項目'), `<p class="ref-see-also">${seeAlso.map((item) => seeAlsoLink(item, ownerName, methodNames)).join(', ')}</p>`);
      }

      const yesNo = (value) => (value ? tr('Yes', 'はい') : tr('No', 'いいえ'));
      html += section('metadata', tr('Method Metadata', 'メソッドのメタデータ'), `
        <div class="meta-box">
          <table class="meta-table">
            <tbody>
              <tr><th style="width: 22%;">${tr('Defining Class', '定義クラス')}</th><td>${defining ? classLink(defining) : 'N/A'}</td></tr>
              <tr><th>${tr('Overrides', 'オーバーライド元')}</th><td>${m.Overrides ? classLink(m.Overrides) : muted('-')}</td></tr>
              <tr><th>${tr('Implemented in', '実装場所')}</th><td>${cell(IMPLEMENTED_IN_LABELS[m.ImplementedIn] ? tr(...IMPLEMENTED_IN_LABELS[m.ImplementedIn]) : m.ImplementedIn)}</td></tr>
              <tr><th>${tr('Group', 'グループ')}</th><td>${cell(groupLabel(group))}</td></tr>
              <tr><th>${tr('Access', 'アクセス')}</th><td>${cell(m.Access, 'N/A')}</td></tr>
              <tr><th>Static</th><td>${yesNo(m.Static)}</td></tr>
              <tr><th>Abstract</th><td>${yesNo(m.Abstract)}</td></tr>
              <tr><th>Sealed</th><td>${yesNo(m.Sealed)}</td></tr>
              <tr><th>Constructor</th><td>${yesNo(m.IsConstructor)}</td></tr>
              <tr><th>Hidden</th><td>${yesNo(m.Hidden)}</td></tr>
            </tbody>
          </table>
        </div>`);

      container.innerHTML = html;
      document.getElementById('page-toc').innerHTML = sections.map(([id, title]) =>
        `<li><a href="#${id}" onclick="document.getElementById('${id}')?.scrollIntoView(); return false;">${title}</a></li>`).join('');
      mountCallGraph(ownerName, m);
    }

    // ---- Call graph: who uses this method and what it uses --------------------
    // Reads database/list_CallGraph.js (see export_class_database.m). Without the
    // file, or without an entry for this method, the page stays as it is.
    const CG = {
      limits: { callers: 10, method: 8, subclass: 6, candidates: 4, property: 6, parameter: 4, child: 6 },
      row: 30, box: 26, head: 24, wide: 700, charWidth: 7.3,
      ruleText: {
        self: ['the object itself', 'オブジェクト自身'], declared: ['declared class', '宣言されたクラス'],
        constructor: ['constructor or class reference', 'コンストラクタまたはクラス参照'],
        assignment: ['assignment tracking', '代入の追跡'], argument: ['argument of a helper', '補助関数の引数'],
        name: ['naming rule', '命名規則'], unique: ['the only class with this member', 'このメンバーを持つ唯一のクラス'],
        candidates: ['class not determinable', 'クラスを特定できない']
      },
      confidenceText: { certain: ['certain', '確定'], inferred: ['inferred', '推定'], candidates: ['candidates', '候補'] }
    };

    function mountCallGraph(ownerName, m) {
      loader.loadCallGraph().then((graph) => {
        if (!graph) return;
        const model = indexCallGraph(graph);
        const current = model.nodeIndex.get(`${m.Defining || ownerName}.${m.Name}`);
        if (current === undefined) return;
        const hasEdges = model.from.has(current) || model.to.has(current) || model.dynamic.has(current);
        const anchor = document.getElementById('metadata');
        if (!hasEdges || !anchor) return;

        anchor.insertAdjacentHTML('beforebegin', `
          <h2 id="call-graph">${tr('Call Graph', '呼び出しグラフ')}</h2>
          <p class="cg-lead">${tr('Read from the source without running it, for the System classes. Line style shows how sure each link is; see <a href="developer/class-documentation.html#call-graph">Class Documentation</a> for the limits.', 'System クラスについて、ソースを実行せずに読み取った結果。線の種類はリンクの確からしさ。限界は <a href="developer/class-documentation.html#call-graph">Class Documentation</a> を参照。')}</p>
          <div class="cg-chart" id="cg-chart"></div>
          ${renderCallGraphDynamic(model, current)}
          ${renderCallGraphLegend()}`);
        const metadataItem = document.querySelector('#page-toc a[href="#metadata"]')?.parentElement;
        metadataItem?.insertAdjacentHTML('beforebegin',
          `<li><a href="#call-graph" onclick="document.getElementById('call-graph')?.scrollIntoView(); return false;">${tr('Call Graph', '呼び出しグラフ')}</a></li>`);

        const chart = document.getElementById('cg-chart');
        const state = { expanded: new Set(), showAll: new Set(), width: 0 };
        const draw = () => {
          state.width = chart.clientWidth;
          chart.innerHTML = renderCallGraph(model, current, state);
        };
        chart.addEventListener('click', (event) => {
          const target = event.target.closest('[data-cg-toggle], [data-cg-more]');
          if (!target) return;
          event.preventDefault();
          toggleCallGraph(state, target);
          draw();
        });
        chart.addEventListener('keydown', (event) => {
          const target = event.target.closest('[data-cg-toggle], [data-cg-more]');
          if (!target || (event.key !== 'Enter' && event.key !== ' ')) return;
          event.preventDefault();
          const selector = target.dataset.cgToggle ? `[data-cg-toggle="${target.dataset.cgToggle}"]` : `[data-cg-more="${target.dataset.cgMore}"]`;
          toggleCallGraph(state, target);
          draw();
          chart.querySelector(selector)?.focus();
        });
        draw();
        if (window.ResizeObserver) {
          new ResizeObserver(() => { if (chart.clientWidth !== state.width) draw(); }).observe(chart);
        }
      });
    }

    function toggleCallGraph(state, target) {
      const [set, key] = target.dataset.cgToggle ? [state.expanded, target.dataset.cgToggle] : [state.showAll, target.dataset.cgMore];
      if (set.has(key)) set.delete(key); else set.add(key);
    }

    function indexCallGraph(graph) {
      const model = { graph, nodeIndex: new Map(), from: new Map(), to: new Map(), dynamic: new Map(), implementers: new Map() };
      graph.nodes.forEach((name, index) => model.nodeIndex.set(name, index));
      const push = (map, key, value) => { if (!map.has(key)) map.set(key, []); map.get(key).push(value); };
      graph.edges.forEach((edge) => {
        push(model.from, edge[0], edge);
        (Array.isArray(edge[1]) ? edge[1] : [edge[1]]).forEach((to) => push(model.to, to, edge));
      });
      (graph.dynamic || []).forEach((row) => push(model.dynamic, row[0], row));
      (graph.implementers || []).forEach(([node, count]) => model.implementers.set(node, count));
      return model;
    }

    // "Class.member", "pkg.Class.member", or "Class.get.prop" for an accessor.
    function callGraphNodeParts(name) {
      const accessor = name.match(/^(.*)\.((?:get|set)\.[^.]+)$/);
      if (accessor) return { className: accessor[1], member: accessor[2], accessor: true };
      const dot = name.lastIndexOf('.');
      return { className: name.slice(0, dot), member: name.slice(dot + 1), accessor: false };
    }

    function callGraphHref(name, kind) {
      const parts = callGraphNodeParts(name);
      return kind === 'method' && !parts.accessor
        ? loader.pageUrl('method.html', { class: parts.className, method: parts.member })
        : loader.pageUrl('class.html', { class: parts.className });
    }

    function callGraphSource(model, edge) {
      return `${model.graph.files[edge[5]]}:${edge[6]}`;
    }

    function callGraphRow(model, name, kind, edge, extra) {
      const confidence = model.graph.confidences[edge[3]];
      const rule = model.graph.rules[edge[4]];
      const count = model.implementers.get(model.nodeIndex.get(name));
      const kindText = kind === 'subclass'
        ? tr(`implemented in ${count ? `${count} ` : ''}subclasses`, `${count ? `${count} 個の` : ''}サブクラスで実装`)
        : (kind === 'parameter' ? tr('Parameter value', 'パラメーター値') : ({ method: tr('method', 'メソッド'), property: tr('property', 'プロパティ') })[kind] || kind);
      const confidenceText = CG.confidenceText[confidence] ? tr(...CG.confidenceText[confidence]) : confidence;
      const ruleText = CG.ruleText[rule] ? tr(...CG.ruleText[rule]) : rule;
      return {
        name, kind, confidence, parts: callGraphNodeParts(name), href: callGraphHref(name, kind),
        title: `${name} (${kindText})\n${confidenceText}: ${ruleText}\n${callGraphSource(model, edge)}`,
        ...extra
      };
    }

    // What a node uses, in groups. A property with a get. accessor uses what the accessor uses.
    function callGraphUses(model, node) {
      const name = model.graph.nodes[node];
      const parts = callGraphNodeParts(name);
      const accessor = model.nodeIndex.get(`${parts.className}.get.${parts.member}`);
      const edges = [...(model.from.get(node) || []), ...(accessor !== undefined ? (model.from.get(accessor) || []) : [])];
      const groups = { method: [], subclass: [], candidates: [], property: [], parameter: [] };
      edges.forEach((edge) => {
        const kind = model.graph.kinds[edge[2]];
        if (Array.isArray(edge[1])) {
          const names = edge[1].map((to) => model.graph.nodes[to]);
          const member = callGraphNodeParts(names[0]).member;
          groups.candidates.push({
            kind: 'candidates', confidence: 'candidates', member, memberKind: kind, parts: { className: '', member },
            title: `${member}: ${tr('class not determinable', 'クラスを特定できない')}\n${callGraphSource(model, edge)}`,
            branches: names.map((to) => callGraphRow(model, to, kind, edge))
          });
        } else if (edge[1] !== node && edge[1] !== accessor) {
          groups[kind].push(callGraphRow(model, model.graph.nodes[edge[1]], kind, edge, { node: edge[1] }));
        }
      });
      return groups;
    }

    function callGraphCallers(model, node) {
      const seen = new Map();
      (model.to.get(node) || []).forEach((edge) => {
        const old = seen.get(edge[0]);
        if (edge[0] !== node && (!old || edge[3] < old[3])) seen.set(edge[0], edge);
      });
      return [...seen.values()].map((edge) => callGraphRow(model, model.graph.nodes[edge[0]], 'method', edge, { node: edge[0] }));
    }

    function callGraphSort(rows) {
      const rank = { certain: 0, inferred: 1, candidates: 2 };
      return rows.sort((a, b) => (rank[a.confidence] - rank[b.confidence]) || a.parts.member.localeCompare(b.parts.member));
    }

    // Rows of one column: group headings, nodes, branches of candidates, one level of expansion.
    function callGraphColumn(model, state, side, current) {
      const lines = [];
      const addRows = (rows, limit, moreKey, depth, parent) => {
        const shown = state.showAll.has(moreKey) ? rows : rows.slice(0, limit);
        shown.forEach((row) => {
          const key = `${side}:${depth}:${row.name || row.member}:${parent ? parent.name : ''}`;
          const nested = depth === 0 && row.node !== undefined ? callGraphChildren(model, side, row.node) : null;
          const line = { type: 'node', row, depth, parent, key, expandable: Boolean(nested && nested.length), open: state.expanded.has(key) };
          lines.push(line);
          if (row.branches) {
            row.branches.forEach((branch) => lines.push({ type: 'branch', row: branch, depth: depth + 1, parent: row, key: `${key}:${branch.name}` }));
          }
          if (line.expandable && line.open) {
            addRows(nested, CG.limits.child, `${key}:more`, depth + 1, row);
          }
        });
        if (rows.length > limit) {
          lines.push({ type: 'more', key: moreKey, depth, open: state.showAll.has(moreKey), count: rows.length - limit });
        }
      };
      if (side === 'callers') {
        const rows = callGraphSort(callGraphCallers(model, current));
        lines.push({ type: 'head', text: `${tr('Called by', '呼び出し元')} (${rows.length})` });
        if (!rows.length) lines.push({ type: 'none', text: tr('No caller in the System classes', 'System クラス内の呼び出し元なし') });
        addRows(rows, CG.limits.callers, 'callers', 0);
      } else {
        const groups = callGraphUses(model, current);
        const titles = {
          method: tr('Methods', 'メソッド'), subclass: tr('In subclasses', 'サブクラス内'), property: tr('Properties', 'プロパティ'),
          parameter: tr('Parameter values', 'パラメーター値'), candidates: tr('Class not determinable', 'クラスを特定できない')
        };
        let any = false;
        Object.keys(titles).forEach((group) => {
          if (!groups[group].length) return;
          any = true;
          lines.push({ type: 'head', text: `${titles[group]} (${groups[group].length})` });
          addRows(callGraphSort(groups[group]), CG.limits[group], group, 0);
        });
        if (!any) {
          lines.push({ type: 'head', text: tr('Uses', '使用先') });
          lines.push({ type: 'none', text: tr('No member of the System classes', 'System クラスのメンバーの使用なし') });
        }
      }
      return lines;
    }

    function callGraphChildren(model, side, node) {
      if (side === 'callers') return callGraphSort(callGraphCallers(model, node));
      const groups = callGraphUses(model, node);
      return [...groups.method, ...groups.subclass, ...groups.property, ...groups.parameter, ...groups.candidates.map((row) => ({ ...row, branches: null }))];
    }

    function callGraphLabel(row, currentClass, width) {
      const capacity = Math.max(4, Math.floor(width / CG.charWidth));
      const member = row.parts.member;
      const prefix = row.parts.className && row.parts.className !== currentClass ? `${row.parts.className}.` : '';
      if (prefix.length + member.length <= capacity) return { prefix, member };
      if (member.length <= capacity) {
        const room = capacity - member.length - 1;
        return { prefix: room >= 3 ? `${prefix.slice(0, room)}…` : '', member };
      }
      return { prefix: '', member: `${member.slice(0, capacity - 1)}…` };
    }

    function callGraphNodeSvg(line, x, y, width, currentClass) {
      const row = line.row;
      const h = CG.box;
      const textWidth = width - 18 - (line.expandable ? 20 : 0);
      if (line.type === 'node' && row.kind === 'candidates') {
        return `<g class="cg-node is-candidates"><title>${escapeHtml(row.title)}</title><text class="cg-text" x="${x + 8}" y="${y + 17}">${escapeHtml(callGraphLabel(row, currentClass, width).member)}<tspan class="cg-prefix"> ?</tspan></text></g>`;
      }
      const label = callGraphLabel(row, currentClass, textWidth);
      const pill = row.kind === 'property' || row.kind === 'parameter';
      const shapes = {
        method: `<rect class="cg-box" x="${x}" y="${y}" width="${width}" height="${h}" rx="2"/><rect class="cg-bar" x="${x}" y="${y}" width="3" height="${h}"/>`,
        property: `<rect class="cg-box is-property" x="${x}" y="${y}" width="${width}" height="${h}" rx="${h / 2}"/>`,
        parameter: `<rect class="cg-box is-parameter" x="${x}" y="${y}" width="${width}" height="${h}" rx="${h / 2}"/>`,
        subclass: `<rect class="cg-box" x="${x + 3}" y="${y - 3}" width="${width - 3}" height="${h}" rx="2"/><rect class="cg-box" x="${x}" y="${y}" width="${width - 3}" height="${h}" rx="2"/>`
      };
      const toggle = line.expandable
        ? `<g class="cg-toggle" role="button" tabindex="0" aria-expanded="${line.open}" aria-label="${line.open ? tr('Collapse', '折りたたむ:') : tr('Expand', '展開する:')} ${escapeHtml(row.name)}" data-cg-toggle="${escapeHtml(line.key)}"><rect x="${x + width - 22}" y="${y + 3}" width="18" height="${h - 6}" rx="2"/><text x="${x + width - 13}" y="${y + 18}" text-anchor="middle">${line.open ? '−' : '+'}</text></g>`
        : '';
      return `<g class="cg-node"><a href="${escapeHtml(row.href)}"><title>${escapeHtml(row.title)}</title>${shapes[row.kind] || shapes.method}<text class="cg-text${row.kind === 'parameter' ? ' is-parameter' : ''}" x="${x + (pill ? 12 : 9)}" y="${y + 17}"><tspan class="cg-prefix">${escapeHtml(label.prefix)}</tspan>${escapeHtml(label.member)}</text></a>${toggle}</g>`;
    }

    function callGraphLinkClass(confidence) {
      return `cg-link is-${confidence}`;
    }

    function renderCallGraph(model, current, state) {
      const width = Math.max(state.width, 280);
      const name = model.graph.nodes[current];
      const parts = callGraphNodeParts(name);
      const callers = callGraphColumn(model, state, 'callers', current);
      const uses = callGraphColumn(model, state, 'uses', current);
      return width >= CG.wide
        ? renderCallGraphWide(callers, uses, parts, width)
        : renderCallGraphNarrow(callers, uses, parts, width);
    }

    function callGraphLineHeight(line) {
      return line.type === 'head' ? CG.head : CG.row;
    }

    function callGraphOtherLineSvg(line, x, y, width, anchor) {
      const tx = anchor === 'end' ? x + width : x;
      if (line.type === 'head') {
        return `<text class="cg-head" x="${tx}" y="${y + 16}" text-anchor="${anchor}">${escapeHtml(line.text)}</text>`;
      }
      if (line.type === 'none') {
        return `<text class="cg-none" x="${tx}" y="${y + 18}" text-anchor="${anchor}">${escapeHtml(line.text)}</text>`;
      }
      const text = line.open ? tr('Show fewer', '表示を減らす') : tr(`+${line.count} more`, `ほか ${line.count} 件`);
      return `<text class="cg-more" role="button" tabindex="0" data-cg-more="${escapeHtml(line.key)}" x="${tx}" y="${y + 18}" text-anchor="${anchor}">${text}</text>`;
    }

    // Wide: callers, the method, then what it uses, from left to right.
    function renderCallGraphWide(callers, uses, parts, width) {
      const gap = 56;
      const centerWidth = Math.min(230, Math.max(150, parts.member.length * CG.charWidth + 28));
      const colWidth = (width - centerWidth - 2 * gap) / 2;
      const heightOf = (lines) => lines.reduce((sum, line) => sum + callGraphLineHeight(line), 0);
      const height = Math.max(heightOf(callers), heightOf(uses), CG.box + 14) + 8;
      const centerX = colWidth + gap;
      const centerY = height / 2;
      let links = '';
      let nodes = '';
      const place = (lines, side) => {
        let y = (height - heightOf(lines)) / 2;
        const indent = 16;
        const centers = new Map();
        lines.forEach((line) => {
          const h = callGraphLineHeight(line);
          if (line.type === 'node' || line.type === 'branch') {
            const inset = line.depth * indent;
            const boxWidth = colWidth - inset;
            const x = side === 'callers' ? 0 : colWidth + 2 * gap + centerWidth + inset;
            const midY = y + CG.box / 2 + 2;
            const inner = side === 'callers' ? x + boxWidth : x;
            if (line.depth === 0) {
              const [x1, y1, x2, y2] = side === 'callers'
                ? [inner, midY, centerX, centerY]
                : [centerX + centerWidth, centerY, inner, midY];
              const bend = gap * 0.55;
              links += `<path class="${callGraphLinkClass(line.row.confidence)}" d="M${x1} ${y1}C${x1 + bend} ${y1} ${x2 - bend} ${y2} ${x2} ${y2}" marker-end="url(#cg-arrow)"/>`;
            } else if (line.parent) {
              const from = centers.get(line.parent);
              if (from !== undefined) {
                const px = side === 'callers' ? x + boxWidth + indent - 6 : x - indent + 6;
                links += `<path class="${callGraphLinkClass(line.row.confidence)}" d="M${px} ${from + CG.box / 2}V${midY}H${inner}"/>`;
              }
            }
            centers.set(line.row, y + 2);
            nodes += callGraphNodeSvg(line, x, y + 2, boxWidth, parts.className);
          } else {
            const inset = (line.depth || 0) * indent;
            const x = side === 'callers' ? 0 : colWidth + 2 * gap + centerWidth + inset;
            nodes += callGraphOtherLineSvg(line, x, y, colWidth - inset, 'start');
          }
          y += h;
        });
      };
      place(callers, 'callers');
      place(uses, 'uses');
      const current = `<g class="cg-current"><title>${escapeHtml(parts.className)}.${escapeHtml(parts.member)}</title><rect x="${centerX}" y="${centerY - 19}" width="${centerWidth}" height="38" rx="2"/><text class="cg-current-class" x="${centerX + centerWidth / 2}" y="${centerY - 4}" text-anchor="middle">${escapeHtml(callGraphTruncate(parts.className, centerWidth - 16))}</text><text class="cg-current-member" x="${centerX + centerWidth / 2}" y="${centerY + 12}" text-anchor="middle">${escapeHtml(callGraphTruncate(parts.member, centerWidth - 16))}</text></g>`;
      return callGraphSvg(width, height, links + nodes + current);
    }

    function callGraphTruncate(text, width) {
      const capacity = Math.floor(width / CG.charWidth);
      return text.length <= capacity ? text : `${text.slice(0, capacity - 1)}…`;
    }

    // Narrow: one column with callers above and uses below, joined by a line on the left.
    function renderCallGraphNarrow(callers, uses, parts, width) {
      const trunk = 6;
      const indent = 22;
      const inner = width - indent;
      let y = 0;
      let links = '';
      let nodes = '';
      const place = (lines, arrowToRow) => {
        const centers = new Map();
        const stubs = [];
        lines.forEach((line) => {
          if (line.type === 'node' || line.type === 'branch') {
            const inset = line.depth * 14;
            const midY = y + 2 + CG.box / 2;
            if (line.depth === 0) {
              stubs.push(midY);
              links += arrowToRow
                ? `<path class="${callGraphLinkClass(line.row.confidence)}" d="M${trunk} ${midY}H${indent}" marker-end="url(#cg-arrow)"/>`
                : `<path class="${callGraphLinkClass(line.row.confidence)}" d="M${indent} ${midY}H${trunk}"/>`;
            } else if (centers.has(line.parent)) {
              links += `<path class="${callGraphLinkClass(line.row.confidence)}" d="M${indent + inset - 8} ${centers.get(line.parent) + CG.box / 2}V${midY}H${indent + inset}"/>`;
            }
            centers.set(line.row, y + 2);
            nodes += callGraphNodeSvg(line, indent + inset, y + 2, inner - inset, parts.className);
          } else {
            nodes += callGraphOtherLineSvg(line, indent + (line.depth || 0) * 14, y, inner, 'start');
          }
          y += callGraphLineHeight(line);
        });
        return stubs;
      };
      const callerStubs = place(callers, false);
      y += 6;
      const centerTop = y;
      nodes += `<g class="cg-current"><title>${escapeHtml(parts.className)}.${escapeHtml(parts.member)}</title><rect x="${indent}" y="${centerTop}" width="${inner}" height="38" rx="2"/><text class="cg-current-class" x="${indent + 10}" y="${centerTop + 15}">${escapeHtml(callGraphTruncate(parts.className, inner - 20))}</text><text class="cg-current-member" x="${indent + 10}" y="${centerTop + 31}">${escapeHtml(callGraphTruncate(parts.member, inner - 20))}</text></g>`;
      const centerMid = centerTop + 19;
      y += 44;
      const useStubs = place(uses, true);
      const top = callerStubs.length ? callerStubs[0] : centerMid;
      const bottom = useStubs.length ? useStubs[useStubs.length - 1] : centerMid;
      links += `<path class="cg-trunk" d="M${trunk} ${top}V${bottom}"/>`;
      links += `<path class="cg-trunk" d="M${trunk} ${centerMid}H${indent}"${callerStubs.length ? ' marker-end="url(#cg-arrow)"' : ''}/>`;
      return callGraphSvg(width, y + 8, links + nodes);
    }

    function callGraphSvg(width, height, body) {
      return `<svg class="cg-svg" role="img" aria-label="${tr('Callers and uses of this method', 'このメソッドの呼び出し元と使用先')}" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><marker id="cg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="cg-arrow" d="M0 0.8L7 4L0 7.2z"/></marker></defs>${body}</svg>`;
    }

    function renderCallGraphDynamic(model, current) {
      const rows = model.dynamic.get(current);
      if (!rows) return '';
      const places = [...new Set(rows.map((row) => `${model.graph.files[row[1]]}:${row[2]}`))];
      const list = places.slice(0, 4).map((place) => `<code>${escapeHtml(place)}</code>`).join(', ');
      return `<p class="cg-note">${tr(
        `Uses dynamic access (<code>obj.(name)</code>, <code>feval</code>, <code>eval</code>) whose targets are not shown: ${list}${places.length > 4 ? ` and ${places.length - 4} more` : ''}.`,
        `動的アクセス（<code>obj.(name)</code>、<code>feval</code>、<code>eval</code>）を使っており、その参照先は表示していません: ${list}${places.length > 4 ? ` ほか ${places.length - 4} 件` : ''}。`
      )}</p>`;
    }

    function renderCallGraphLegend() {
      const link = (confidence, text) => `<li><svg width="34" height="10" aria-hidden="true"><path class="cg-link is-${confidence}" d="M1 5H33"/></svg>${text}</li>`;
      const node = (shape, text) => `<li><svg width="34" height="18" aria-hidden="true">${shape}</svg>${text}</li>`;
      return `
        <ul class="cg-legend">
          ${link('certain', tr('Certain', '確定'))}
          ${link('inferred', tr('Inferred', '推定'))}
          ${link('candidates', tr('Class not determinable: every candidate is listed', 'クラスを特定できない: 候補をすべて表示'))}
          ${node('<rect class="cg-box" x="1" y="2" width="32" height="14" rx="2"/><rect class="cg-bar" x="1" y="2" width="3" height="14"/>', tr('Method', 'メソッド'))}
          ${node('<rect class="cg-box is-property" x="1" y="2" width="32" height="14" rx="7"/>', tr('Property', 'プロパティ'))}
          ${node('<rect class="cg-box is-parameter" x="1" y="2" width="32" height="14" rx="7"/>', tr('Parameter value', 'パラメーター値'))}
          ${node('<rect class="cg-box" x="4" y="1" width="29" height="13" rx="2"/><rect class="cg-box" x="1" y="4" width="29" height="13" rx="2"/>', tr('Implemented in subclasses', 'サブクラスで実装'))}
        </ul>`;
    }
  </script>
</body>
</html>
