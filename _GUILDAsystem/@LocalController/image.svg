<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 600 250" role="img">
        <title id="cl-map-title">A component owns an AVR; the AVR owns a PSS. Each controller observes the component by name and drives the input of the same name of its parent.</title>
        <defs>
          <marker id="cl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#1B2127"/></marker>
          <marker id="cl-ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5A6570"/></marker>
        </defs>
        <rect x="200" y="12" width="200" height="48" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="300" y="34" text-anchor="middle" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">Component</text>
        <text x="300" y="51" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#38424C">sv_x · sv_y · sv_u</text>
        <path d="M300 60V96" fill="none" stroke-width="1.6" marker-end="url(#cl-ah)" style="stroke:#1B2127"/>
        <text x="306" y="84" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#1B2127">a_LocalController</text>

        <rect x="200" y="100" width="200" height="52" rx="4" style="fill:#1B2127"/>
        <text x="300" y="124" text-anchor="middle" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#FFFFFF">LocalController</text>
        <text x="300" y="142" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#FFFFFF">key "avr" · "local"</text>

        <path d="M300 152V186" fill="none" stroke-width="1.6" marker-end="url(#cl-ah)" style="stroke:#1B2127"/>
        <text x="306" y="174" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#1B2127">a_LocalController</text>
        <rect x="200" y="190" width="200" height="40" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#1B2127"/>
        <text x="300" y="215" text-anchor="middle" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#1B2127">LocalController "pss"</text>

        <path d="M410 126H470V36H404" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <text x="476" y="78" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#5A6570">sv_y → u</text>
        <text x="476" y="94" font-size="11" style="fill:#5A6570">drives by name</text>
        <path d="M196 36H130V126H196" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <text x="124" y="78" text-anchor="end" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#5A6570">y, x → sv_u</text>
        <text x="124" y="94" text-anchor="end" font-size="11" style="fill:#5A6570">observes by name</text>
      </svg>
