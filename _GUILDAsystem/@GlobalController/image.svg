<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 600 230" role="img">
        <title id="cl-map-title">PowerNetwork owns the global controller. The controller refers to several components: it reads their states and drives their inputs.</title>
        <defs>
          <marker id="cl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#1B2127"/></marker>
          <marker id="cl-ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5A6570"/></marker>
        </defs>
        <rect x="200" y="12" width="200" height="44" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="300" y="40" text-anchor="middle" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">PowerNetwork</text>
        <path d="M300 56V92" fill="none" stroke-width="1.6" marker-end="url(#cl-ah)" style="stroke:#1B2127"/>
        <text x="306" y="80" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#1B2127">a_GlobalController</text>

        <rect x="200" y="96" width="200" height="52" rx="4" style="fill:#1B2127"/>
        <text x="300" y="120" text-anchor="middle" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#FFFFFF">GlobalController</text>
        <text x="300" y="138" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#FFFFFF">x · sv_u · sv_y</text>

        <rect x="40" y="176" width="140" height="40" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="110" y="201" text-anchor="middle" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">Component</text>
        <rect x="230" y="176" width="140" height="40" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="300" y="201" text-anchor="middle" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">Component</text>
        <text x="420" y="201" font-size="14" style="fill:#5A6570">…</text>
        <path d="M240 148L140 174" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <path d="M300 148V172" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <text x="410" y="160" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#5A6570">controlledUnits</text>
        <text x="410" y="176" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#38424C">x → sv_u,  sv_y → u</text>

        <text x="20" y="120" font-size="11" style="fill:#5A6570">Solid: owns.</text>
        <text x="20" y="136" font-size="11" style="fill:#5A6570">Dashed: refers only.</text>
      </svg>
