<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 600 210" role="img">
        <title id="cl-map-title">PowerNetwork owns the branch. The branch refers to a from bus and a to bus without owning them.</title>
        <defs>
          <marker id="cl-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#1B2127"/></marker>
          <marker id="cl-ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5A6570"/></marker>
        </defs>
        <rect x="200" y="12" width="200" height="44" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="300" y="40" text-anchor="middle" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">PowerNetwork</text>
        <path d="M300 56V92" fill="none" stroke-width="1.6" marker-end="url(#cl-ah)" style="stroke:#1B2127"/>
        <text x="306" y="80" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#1B2127">a_Branch</text>

        <rect x="190" y="96" width="220" height="56" rx="4" style="fill:#0059A7"/>
        <text x="300" y="122" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#FFFFFF">Branch</text>
        <text x="300" y="141" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#C7D8EA">R · X · C · tap · phase</text>

        <rect x="20" y="102" width="100" height="44" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="70" y="130" text-anchor="middle" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">Bus</text>
        <rect x="480" y="102" width="100" height="44" rx="4" stroke-width="1.5" style="fill:#FFFFFF; stroke:#0059A7"/>
        <text x="530" y="130" text-anchor="middle" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#0059A7">Bus</text>
        <path d="M190 124H124" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <path d="M410 124H476" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cl-ah-m)" style="stroke:#5A6570"/>
        <text x="155" y="116" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#5A6570">a_Bus{1}</text>
        <text x="445" y="116" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:#5A6570">a_Bus{2}</text>
        <text x="70" y="164" text-anchor="middle" font-size="11" style="fill:#38424C">from</text>
        <text x="530" y="164" text-anchor="middle" font-size="11" style="fill:#38424C">to</text>

        <text x="20" y="196" font-size="11" style="fill:#5A6570">Solid: owns. Dashed: refers only (an association, not a parent).</text>
      </svg>
